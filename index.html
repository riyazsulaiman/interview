@csharp
# Q1. Difference between Value Type and Reference Type?
Value types store data directly on the stack.
Reference types store a reference (pointer) on the stack pointing to data on the heap.
Examples of value types: int, bool, float, struct, enum.
Examples of reference types: class, string, array, object.
Assigning a value type copies the actual data.
Assigning a reference type copies the reference — both variables point to the same object.
Key interview line: "Value types are copied, reference types are referenced."
# Q2. Stack vs Heap?
Stack is fast, auto-managed memory used for value types and method call frames.
Heap is for dynamically allocated memory used by reference types.
Stack memory is automatically freed when a method exits.
Heap memory is managed by the Garbage Collector.
Stack is LIFO — Last In First Out.
Variables on the stack have a fixed, known size at compile time.
# Q3. Boxing and Unboxing?
Boxing is converting a value type to an object (reference type).
This allocates heap memory and copies the value into it.
Unboxing is casting the object back to a value type.
Example: int x = 5; object o = x; — this is boxing.
int y = (int)o; — this is unboxing.
Both have a performance cost due to heap allocation.
Avoid in tight loops — causes repeated heap allocations.
# Q4. What is CLR?
CLR stands for Common Language Runtime.
It is the execution engine of the .NET framework.
It manages memory (garbage collection), type safety, exception handling, and security.
It converts IL (Intermediate Language) code to native machine code via JIT.
All .NET languages (C#, VB.NET, F#) compile down to IL and run on the CLR.
# Q5. What is CTS?
CTS stands for Common Type System.
It defines how types are declared, used, and managed in the .NET runtime.
It ensures all .NET languages use the same base types.
For example, int in C# and Integer in VB.NET both map to System.Int32 in CTS.
It enables cross-language interoperability.
# Q6. What is CLS?
CLS stands for Common Language Specification.
It is a subset of CTS — a set of rules that all .NET languages must follow.
Any code written following CLS rules can be used by any .NET language.
It ensures language interoperability.
Example: CLS does not allow unsigned types because some languages don't support them.
# Q7. What is JIT Compiler?
JIT stands for Just-In-Time Compiler.
It converts IL (Intermediate Language) code to native machine code at runtime.
This happens the first time a method is called.
After the first compilation, the native code is cached and reused.
There are three types: Normal JIT, Pre-JIT, and Econo-JIT.
JIT enables platform-specific optimization at runtime.
# Q8. Managed vs Unmanaged Code?
Managed code runs under the .NET runtime (CLR).
The CLR handles memory, garbage collection, and type safety automatically.
Unmanaged code runs outside the CLR — like native C or C++ code.
Unmanaged code must manually manage memory allocation and deallocation.
In .NET, you interact with unmanaged code via P/Invoke or COM Interop.
Any unmanaged resources (file handles, DB connections) should be wrapped in IDisposable.
# Q9. What is Garbage Collection?
Garbage Collection (GC) is the automatic memory management system in .NET.
It periodically finds objects with no references and frees their heap memory.
Developers don't manually free memory like in C/C++.
The GC runs in the background and compacts the heap.
Key interview line: "GC handles managed memory automatically. Use IDisposable for unmanaged resources."
# Q10. GC Generations?
The GC divides the heap into three generations.
Generation 0: newly allocated, short-lived objects — collected most frequently.
Generation 1: objects that survived a Gen 0 collection — medium-lived.
Generation 2: long-lived objects like static data — collected least often.
Large Object Heap (LOH) stores objects larger than 85KB — collected with Gen 2.
This generational approach improves GC performance by focusing on short-lived objects.
# Q11. Encapsulation?
Encapsulation is hiding the internal state of an object and exposing only what is necessary.
It protects data from unintended modification.
Achieved using private fields with public getters and setters (properties).
Example: private int _salary; public int Salary { get; private set; }
Key interview line: "Encapsulation = hide implementation, expose a clean interface."
# Q12. Abstraction?
Abstraction means showing only essential features and hiding complexity.
The user interacts with a simple interface without knowing the internal workings.
Achieved in C# via abstract classes and interfaces.
Example: You use a car's steering wheel without knowing the engine mechanics.
Abstraction is about WHAT something does; Encapsulation is about HOW it hides data.
# Q13. Inheritance?
Inheritance allows a child class to inherit properties and methods from a parent class.
Promotes code reuse and establishes an is-a relationship.
In C#, use the colon (:) to inherit: class Dog : Animal
C# supports single inheritance for classes.
A class can implement multiple interfaces.
Use inheritance only when there is a true is-a relationship.
# Q14. Polymorphism?
Polymorphism means one interface, many implementations.
Compile-time polymorphism: method overloading — same method name, different parameters.
Runtime polymorphism: method overriding — child class overrides parent's virtual method.
Enables writing flexible, reusable code that works with different object types.
Key interview line: "Polymorphism allows different objects to respond to the same call differently."
# Q15. Overloading vs Overriding?
Overloading: same method name, different parameters in the same class — compile-time.
Overriding: child class redefines a parent's virtual/abstract method — runtime.
Overloading is resolved at compile time (static binding).
Overriding is resolved at runtime (dynamic binding).
Overloading = same class. Overriding = parent-child relationship.
# Q16. Abstract Class?
An abstract class cannot be instantiated directly.
It can have abstract methods (no body — must be overridden) and concrete methods (with body).
It can have constructors, fields, and properties.
Used to define a base template for related classes.
Key difference from interface: abstract class can have implementation; interface cannot (in older C#).
A class can inherit only one abstract class.
# Q17. Interface?
An interface is a pure contract — it defines what a class must do, not how.
All methods are implicitly public and abstract (before C# 8).
C# 8+ supports default interface implementations.
A class can implement multiple interfaces.
Interfaces are used for loose coupling and dependency injection.
Use interface for can-do behavior: IDisposable, IComparable, ILogger.
# Q18. Sealed Class?
A sealed class cannot be inherited by any other class.
Prevents unintended extension of a class.
Example: string is a sealed class in C#.
sealed override on a method means no further class can override that method.
Use for security-sensitive classes or final implementations.
# Q19. Virtual Method?
The virtual keyword on a base class method allows it to be overridden in derived classes.
The child class uses the override keyword to provide a new implementation.
Without virtual, the base class method is always called even through a derived type reference.
Virtual methods use dynamic dispatch — the actual type at runtime decides which method runs.
Key interview line: "virtual + override = runtime polymorphism."
# Q20. Method Hiding?
Method hiding uses the new keyword in a child class to hide a parent's method.
Unlike overriding, the base method is called when accessed via a base type reference.
Example: if you have Base b = new Child(); b.Method() — hiding calls Base.Method(), override calls Child.Method().
Method hiding breaks polymorphism.
Use override for polymorphic behavior; new (hiding) only when intentional.
# Q21. Delegate?
A delegate is a type-safe function pointer — it holds a reference to a method.
It defines the method signature (return type + parameters).
Used to pass methods as arguments, implement callbacks, and events.
Example: delegate int Calculate(int a, int b);
Func<> and Action<> are built-in generic delegate types.
# Q22. Multicast Delegate?
A multicast delegate can hold references to multiple methods.
When invoked, it calls all the methods in its invocation list in order.
Use += to add methods and -= to remove them.
If the delegate has a return type, only the last method's return value is captured.
Events in C# are built on multicast delegates.
# Q23. Events?
Events are built on delegates and provide a publisher-subscriber model.
The publisher raises the event; subscribers listen and react.
The event keyword prevents subscribers from invoking the event directly.
Events use EventHandler<T> as the standard delegate type.
Example: button.Click += OnButtonClick;
Key use: decoupled communication between components.
# Q24. Anonymous Methods?
Anonymous methods are inline methods without a name, using the delegate keyword.
Example: button.Click += delegate(object s, EventArgs e) { Console.WriteLine("Clicked"); };
They can capture variables from the enclosing scope (closures).
Lambda expressions are the modern, cleaner replacement for anonymous methods.
# Q25. Lambda Expressions?
Lambda expressions are shorthand for anonymous methods — cleaner syntax.
Syntax: (parameters) => expression or statement block.
Example: var result = list.Where(x => x.Age > 18);
Used extensively with LINQ and delegates.
They can capture outer variables — this is called a closure.
# Q26. Extension Methods?
Extension methods add new methods to existing types without modifying the original class.
Defined as static methods in a static class with the first parameter using the this keyword.
Example: public static string ToTitleCase(this string s) { ... }
Called as if they were instance methods: "hello world".ToTitleCase()
LINQ methods (Where, Select, etc.) are all extension methods on IEnumerable<T>.
# Q27. Reflection?
Reflection allows inspecting and manipulating types, methods, and properties at runtime.
Used to load assemblies dynamically, inspect metadata, or invoke methods by name.
Example: Type t = typeof(MyClass); t.GetMethods();
Used in frameworks, ORMs (like EF), and serializers (like JSON.NET).
Has a performance cost — use only when necessary.
# Q28. Dynamic Keyword?
The dynamic keyword defers type checking from compile time to runtime.
The compiler skips type checking for dynamic variables.
Example: dynamic x = 5; x = "hello"; — valid at compile time.
Useful when working with COM interop, reflection, or dynamic JSON data.
Overuse can hide bugs — use sparingly and only when necessary.
# Q29. Expression Trees?
Expression trees represent code as data — a tree structure of expressions.
Used by LINQ providers (like EF) to translate C# queries into SQL.
Built using System.Linq.Expressions namespace.
Allow inspecting and modifying code logic at runtime.
Key use case: Entity Framework converts LINQ expression trees into SQL queries.
# Q30. Covariance and Contravariance?
Covariance allows using a more derived type than specified — applies to return types.
Contravariance allows using a less derived type than specified — applies to input parameters.
In C#, out keyword enables covariance in generics; in keyword enables contravariance.
Example: IEnumerable<Dog> can be assigned to IEnumerable<Animal> (covariance).
Example: Action<Animal> can be assigned to Action<Dog> (contravariance).
# Q31. Array vs List?
Array has a fixed size set at creation; List is dynamic and can grow or shrink.
Both are strongly typed.
List has more built-in methods: Add, Remove, Find, Sort.
Array has slightly better performance for fixed-size, indexed access.
Default choice: use List unless size is fixed and performance is critical.
# Q32. List vs HashSet?
List maintains insertion order and allows duplicates.
HashSet does not allow duplicates and has no guaranteed order.
HashSet lookup (Contains) is O(1) — faster than List's O(n).
Use List when you need ordered, indexed access.
Use HashSet when you need fast existence checks and uniqueness enforcement.
# Q33. Dictionary vs Hashtable?
Dictionary<TKey, TValue> is generic, type-safe, and faster.
Hashtable is non-generic — stores objects, requires casting, and is thread-safe but slower.
Dictionary is the modern choice — always prefer it over Hashtable.
Dictionary throws KeyNotFoundException for missing keys; use TryGetValue for safe access.
# Q34. Queue?
Queue<T> is a FIFO (First In, First Out) collection.
Enqueue adds to the back; Dequeue removes from the front; Peek views without removing.
Used for task scheduling, message processing, BFS algorithms.
ConcurrentQueue<T> is the thread-safe version for multi-threaded scenarios.
# Q35. Stack?
Stack<T> is a LIFO (Last In, First Out) collection.
Push adds to the top; Pop removes from the top; Peek views the top without removing.
Used for undo operations, expression parsing, DFS algorithms.
ConcurrentStack<T> is the thread-safe version.
# Q36. Concurrent Collections?
Concurrent collections in System.Collections.Concurrent are thread-safe without explicit locking.
ConcurrentDictionary: thread-safe dictionary with atomic Add/Update/Remove.
ConcurrentQueue: thread-safe FIFO.
ConcurrentStack: thread-safe LIFO.
ConcurrentBag: unordered, thread-safe collection.
Prefer these over manually locking standard collections in multi-threaded code.
# Q37. IEnumerable?
IEnumerable<T> is the base interface for all enumerable sequences.
Exposes a single method: GetEnumerator() — enables foreach iteration.
Represents a forward-only, read-only cursor over a sequence.
Supports deferred (lazy) execution when used with LINQ.
All LINQ extension methods are defined on IEnumerable<T>.
# Q38. ICollection?
ICollection<T> extends IEnumerable<T>.
Adds Count, Add, Remove, Contains, and Clear operations.
Represents a modifiable, countable collection.
Implemented by List<T>, HashSet<T>, Dictionary<T>, etc.
# Q39. IList?
IList<T> extends ICollection<T>.
Adds index-based access: this[int index], IndexOf, Insert, RemoveAt.
Represents an ordered, index-accessible collection.
Implemented by List<T> and arrays.
# Q40. IQueryable?
IQueryable<T> extends IEnumerable<T>.
Translates LINQ queries to a query language (like SQL) and executes on the server.
Used with database providers like Entity Framework.
Defers query execution until iterated.
Key difference from IEnumerable: IEnumerable filters in memory; IQueryable filters on the database.
# Q41. Async Await?
async marks a method as asynchronous.
await pauses execution until the awaited task completes without blocking the thread.
The thread is freed to handle other work while waiting — improves scalability.
Always returns Task (no return value) or Task<T> (with return value).
Key rule: avoid async void except for event handlers.
# Q42. Task?
Task represents an asynchronous operation.
Task is a higher-level abstraction built on the thread pool.
Task<T> returns a result; Task returns void.
Supports continuation (.ContinueWith), cancellation, and exception handling.
Use Task.Run() to offload CPU-bound work to a thread pool thread.
# Q43. Thread?
Thread is a low-level OS-level unit of execution.
Creates a dedicated OS thread — heavier than a Task.
Use Thread when you need explicit control (priority, foreground/background, STA apartment).
For most async work, prefer Task — it's lighter and managed by the thread pool.
Creating many threads directly is expensive — thread pool manages reuse efficiently.
# Q44. Thread Pool?
The thread pool is a managed pool of reusable worker threads.
Avoids the overhead of creating and destroying threads repeatedly.
Task.Run() and async/await use the thread pool automatically.
Controlled by ThreadPool.SetMaxThreads and SetMinThreads.
Key benefit: resource reuse and automatic scaling based on workload.
# Q45. Deadlock?
A deadlock occurs when two or more tasks are waiting on each other and none can proceed.
In async code, calling .Result or .Wait() on an async method can cause a deadlock.
This blocks the thread that the await continuation needs to resume on.
Prevention: use await consistently — never mix blocking calls with async code.
Key rule: if you go async, go async all the way.
# Q46. CancellationToken?
CancellationToken allows cooperative cancellation of async operations.
A CancellationTokenSource creates the token; calling .Cancel() signals cancellation.
The async method checks the token periodically and throws OperationCanceledException.
Pass the token to all async calls in the chain for proper propagation.
Used in long-running API calls, background jobs, and user-cancellable operations.
# Q47. ConfigureAwait?
ConfigureAwait(false) tells the awaiter not to resume on the original synchronization context.
In UI or classic ASP.NET, the sync context is important — resuming on it prevents deadlocks.
In ASP.NET Core, there is no sync context, so ConfigureAwait(false) is less critical.
Use ConfigureAwait(false) in library code to improve performance and avoid deadlocks.
In application-level ASP.NET Core code, it is optional.
# Q48. Parallel Programming?
Parallel programming runs multiple operations simultaneously on multiple CPU cores.
Use Parallel.For and Parallel.ForEach for CPU-bound work.
Use Task.WhenAll for running multiple async tasks concurrently.
Parallel.ForEach is for CPU-bound work; async/await is for I/O-bound work.
Key distinction: don't use Parallel.ForEach with async methods — use async LINQ or Task.WhenAll instead.
# Q49. Race Condition?
A race condition occurs when two threads access shared data simultaneously and the outcome depends on timing.
Leads to unpredictable, hard-to-reproduce bugs.
Prevention: use lock, Monitor, Mutex, or Interlocked for synchronized access.
Use thread-safe collections like ConcurrentDictionary for shared state.
Design stateless services wherever possible to eliminate shared mutable state.
# Q50. Lock Keyword?
The lock keyword acquires a mutual exclusion lock on an object, preventing other threads from entering the same block.
Only one thread can execute the locked block at a time.
The lock object should be a private, readonly object — never lock on this or a string.
Example: lock(_lockObj) { _counter++; }
For simpler atomic operations, use Interlocked.Increment instead of lock.
@netcore
# Q51. What is .NET Core?
.NET Core is a cross-platform, open-source, high-performance framework for building modern applications.
Runs on Windows, Linux, and macOS.
It is the successor to .NET Framework — leaner, faster, and cloud-ready.
From .NET 5 onwards, it was unified and renamed simply to .NET.
Ideal for web APIs, microservices, cloud functions, and console apps.
# Q52. .NET Framework vs .NET Core?
.NET Framework is Windows-only, closed-source, mature, and in maintenance mode.
.NET Core (now .NET 5+) is cross-platform, open-source, faster, and actively developed.
New projects should always use .NET 6/7/8.
.NET Framework is kept for legacy Windows desktop apps (WinForms, WPF).
Key interview line: "New project = .NET 6+. Legacy Windows app = .NET Framework."
# Q53. Middleware?
Middleware are components in the HTTP request pipeline that process requests and responses.
Each middleware either handles the request, modifies it, or passes it to the next via next().
Configured in Program.cs using app.Use*() methods.
Examples: authentication, logging, exception handling, CORS, routing.
Key interview line: "Middleware = steps in an assembly line that every HTTP request passes through."
# Q54. Custom Middleware?
Custom middleware is created by writing a class with an Invoke or InvokeAsync method.
It receives HttpContext and a RequestDelegate (next).
Register it using app.UseMiddleware<MyMiddleware>() in Program.cs.
Used for: custom logging, request timing, IP filtering, custom authentication.
Example structure: constructor receives next delegate; Invoke runs logic before and after next(context).
# Q55. Request Pipeline?
The request pipeline is the ordered sequence of middleware components that process each HTTP request.
Request flows top to bottom through the middleware stack.
Response flows bottom to top (in reverse order) as each middleware returns.
Order matters: UseRouting must come before UseAuthentication, which must come before UseAuthorization.
Short-circuit middleware can stop the pipeline without calling next().
# Q56. Dependency Injection?
DI is a design pattern where an object's dependencies are provided from outside rather than created inside.
ASP.NET Core has a built-in IoC container.
Services are registered in Program.cs: builder.Services.AddScoped<IService, Service>()
Injected via constructors — the container resolves and provides them automatically.
Key benefit: loose coupling, testability, and maintainability.
# Q57. Service Lifetimes?
Singleton: one instance for the entire app lifetime — shared across all requests.
Scoped: one instance per HTTP request — new instance per request but shared within the same request.
Transient: new instance every time it is requested — for lightweight, stateless services.
DbContext should be Scoped. Logging services should be Singleton. Simple helpers can be Transient.
# Q58. Singleton?
Singleton creates one instance when first requested and reuses it for the entire app lifetime.
Be careful with mutable state in singletons — it is shared across all requests.
Not suitable for services that depend on Scoped services (causes captive dependency issue).
Use for: configuration, caching, logging, connection pools.
# Q59. Scoped?
Scoped creates one instance per HTTP request.
The same instance is shared within a single request but a new one is created for the next request.
Entity Framework DbContext is registered as Scoped by default.
Do not inject a Scoped service into a Singleton — it will behave like a Singleton unexpectedly.
# Q60. Transient?
Transient creates a new instance every time it is requested from the DI container.
Best for lightweight, stateless services.
Safe to inject anywhere — no shared state concerns.
Use for: validators, formatters, one-off utility services.
Memory overhead if injected into frequently called services.
# Q61. Startup.cs vs Program.cs?
In .NET 5 and earlier: Startup.cs had ConfigureServices (register DI) and Configure (build middleware pipeline).
In .NET 6+: the minimal hosting model merges everything into Program.cs using the WebApplicationBuilder.
Program.cs is now the single entry point for both service registration and middleware configuration.
Startup.cs can still be used in .NET 6+ by calling builder.WebHost.UseStartup<Startup>() — but it is no longer required.
# Q62. Kestrel?
Kestrel is the cross-platform, built-in web server for ASP.NET Core.
It is lightweight, high-performance, and runs on all platforms.
In production, Kestrel typically sits behind a reverse proxy like IIS, Nginx, or Azure Front Door.
The reverse proxy handles SSL termination, load balancing, and static file serving.
Kestrel handles the actual HTTP processing.
# Q63. Configuration Management?
ASP.NET Core uses a layered configuration system.
Sources: appsettings.json, appsettings.{Environment}.json, environment variables, command-line args, Azure Key Vault.
Access config via IConfiguration injected into constructors.
Use the Options pattern (IOptions<T>) to bind config sections to strongly typed classes.
Environment-specific files override the base appsettings.json values.
# Q64. appsettings.json?
The primary configuration file for ASP.NET Core apps.
Stores connection strings, API keys, feature flags, and app-specific settings.
Can have environment-specific variants: appsettings.Development.json, appsettings.Production.json.
Never commit secrets (passwords, API keys) to appsettings.json.
Use environment variables, Azure Key Vault, or AWS Secrets Manager for production secrets.
# Q65. Environment Variables?
Environment variables are OS-level settings injected at runtime.
They override appsettings.json values in ASP.NET Core's configuration hierarchy.
The ASPNETCORE_ENVIRONMENT variable controls the environment (Development, Staging, Production).
Hierarchy (lowest to highest): appsettings.json → appsettings.{env}.json → environment variables → command-line args.
Use for secrets and environment-specific values in production.
# Q66. Logging?
ASP.NET Core has a built-in logging abstraction: ILogger<T>.
Inject ILogger<T> via DI and call _logger.LogInformation(), LogWarning(), LogError().
Logging providers: Console, Debug, EventLog, Application Insights.
Third-party options: Serilog and NLog for structured logging and advanced sinks.
Log levels: Trace, Debug, Information, Warning, Error, Critical.

Serilog is a popular structured logging library for .NET.
Unlike plain text logging, Serilog logs structured data (key-value pairs) that can be queried.

Configured in Program.cs: Log.Logger = new LoggerConfiguration().WriteTo.Console().CreateLogger();
Replaces the default ASP.NET Core logger with UseSerilog() in the host builder.
# Q68. NLog?
NLog is another popular logging framework for .NET.
Configured via nlog.config XML file or in code.
Supports targets: files, database, email, console.
Slightly less popular than Serilog for structured logging but well-established in enterprise apps.
Both Serilog and NLog integrate with ASP.NET Core's ILogger abstraction.
# Q69. Health Checks?
Health checks expose an endpoint (typically /health) reporting the app's operational status.
ASP.NET Core has built-in health check support via AddHealthChecks() and MapHealthChecks().
Can check: DB connectivity, external API availability, disk space, memory.
Returns: Healthy, Degraded, or Unhealthy status.

# Q70. API Versioning?
API versioning allows maintaining multiple versions of an API simultaneously.
Prevents breaking existing clients when new features are added.
Common approaches: URL versioning (/api/v1/users), query string (?api-version=1.0), or header versioning.

# Q71. Authentication?
Authentication verifies who the user is.
ASP.NET Core supports multiple authentication schemes: JWT Bearer, Cookies, OAuth, OpenID Connect.
Configured in Program.cs with AddAuthentication() and UseAuthentication() middleware.
The [Authorize] attribute protects endpoints — unauthenticated requests return 401.
Authentication must be configured before authorization in the middleware pipeline.
# Q72. Authorization?
Authorization verifies what an authenticated user is allowed to do.
ASP.NET Core supports role-based ([Authorize(Roles="Admin")]) and policy-based authorization.
Configured with AddAuthorization() and UseAuthorization() middleware.
Returns 403 Forbidden when an authenticated user lacks permission.

Policies define complex authorization rules beyond simple role checks.
Defined in Program.cs: builder.Services.AddAuthorization(options => options.AddPolicy("MinAge", policy => policy.RequireClaim("age")));

Custom requirements implement IAuthorizationRequirement and IAuthorizationHandler.
More flexible and maintainable than role-based for complex business rules.
# Q74. Claims Based Authorization?
Claims are key-value pairs representing user attributes stored in the JWT or identity.
Example claims: userId, email, role, department.
Authorization can be based on specific claim values.
Access via User.Claims or User.FindFirst("ClaimType").Value in a controller.
Combining claims and policies gives fine-grained, flexible access control.
# Q75. JWT?
JWT (JSON Web Token) is a compact, self-contained token for stateless authentication.
Structure: header.payload.signature — all Base64 encoded, separated by dots.
Header: algorithm used. Payload: claims (userId, role, expiry). Signature: tamper-proof seal.
Server issues a JWT after login; client sends it in the Authorization: Bearer <token> header.
Server validates the signature and claims without querying the database — stateless.
# Q76. OAuth?
OAuth 2.0 is an authorization framework that allows third-party apps to access user data without sharing credentials.
Example: "Sign in with Google" — Google authenticates the user and returns an access token.
Flow: User → App → Authorization Server (Google) → Access Token → Resource Server.
Roles: Resource Owner (user), Client (your app), Authorization Server (Google), Resource Server (API).
OAuth grants access — it does not directly handle authentication (that is OpenID Connect's job).
# Q77. OpenID Connect?
OpenID Connect (OIDC) is an identity layer built on top of OAuth 2.0.
It adds authentication to OAuth's authorization framework.
Returns an ID token (a JWT) containing user identity information.
Used by identity providers: Azure AD, Google, Okta, Auth0.
Summary: OAuth = authorization (access). OIDC = authentication (identity). Together they handle secure SSO.
# Q78. Refresh Token?
A refresh token is a long-lived token used to get a new access token without re-logging in.
Access tokens are short-lived (15 minutes). Refresh tokens are long-lived (days/weeks).
The client sends the refresh token to a /token/refresh endpoint to get a new access token.
Refresh tokens are stored securely (HTTP-only cookies or secure server-side storage).
On each use, rotate the refresh token (invalidate old, issue new) to detect token theft.
# Q79. Token Expiry?
Short access token expiry (15 minutes) minimizes the window if a token is stolen.
Claims like exp (expiration time) in the JWT are validated on every request.
When the access token expires, use the refresh token to get a new one without requiring re-login.
Configure expiry in AddAuthentication: TokenValidationParameters.ClockSkew = TimeSpan.Zero to enforce exact expiry.
Never set access tokens with very long expiry — it is a security risk.
# Q80. CORS?
CORS (Cross-Origin Resource Sharing) is a browser security policy blocking requests to a different domain.
When your React app (localhost:3000) calls your API (localhost:5000), the browser blocks it without CORS config.
Configure in ASP.NET Core: builder.Services.AddCors() and app.UseCors().
In development, allow all origins. In production, whitelist only your frontend domain.
CORS is enforced by the browser — it is not a server security feature by itself.
# Q81. Swagger?
Swagger (OpenAPI) auto-generates interactive API documentation from your ASP.NET Core code.
Add Swashbuckle.AspNetCore NuGet package.
Configure with AddSwaggerGen() and UseSwagger() / UseSwaggerUI() in Program.cs.

Essential for team collaboration and API consumer onboarding.
# Q82. Filters?
Filters run code at specific points in the ASP.NET Core request processing pipeline.

Applied globally, per controller, or per action using attributes.
More granular than middleware — scoped to the MVC layer.

# Q83. Action Filters?
Action filters run code before and after a controller action executes.
Implement IActionFilter (OnActionExecuting / OnActionExecuted) or inherit ActionFilterAttribute.
Used for: request logging, model validation, permission checks, response caching.
Applied with [MyActionFilter] attribute on controller or action.
Access the action's context (arguments, result) inside the filter methods.

Exception filters handle unhandled exceptions thrown during action execution.

Use global exception middleware for a comprehensive catch-all strategy.
# Q85. Global Exception Handling?
Catches all unhandled exceptions in the entire application pipeline.
In ASP.NET Core, use app.UseExceptionHandler("/error") or a custom exception middleware.
A Problem Details response (RFC 7807) is the standard format for API error responses.
Logs the full exception internally; returns a clean, safe error response to the client.
Never expose stack traces to clients in production.
# Q86. Model Binding?
Model binding automatically maps HTTP request data to action method parameters and model objects.
Sources: [FromBody] (JSON body), [FromQuery] (query string), [FromRoute] (route values), [FromHeader].
The [ApiController] attribute enables automatic model validation and returns 400 if ModelState is invalid.
Binding happens before the action method executes.
Custom model binders can be written for special binding scenarios.
# Q87. Routing?
Routing maps incoming HTTP requests to controller actions based on URL patterns.
Two types: Attribute routing and Conventional routing.
In ASP.NET Core, routing is configured via UseRouting() and UseEndpoints().
Attribute routing is preferred for Web APIs — routes are defined directly on controllers.

# Q88. Attribute Routing?
Routes are defined directly on controllers and actions using [Route], [HttpGet], [HttpPost] attributes.
Example: [HttpGet("users/{id}")] maps GET /users/5 to that action.
More explicit and clear than conventional routing.
Supports route constraints: [HttpGet("users/{id:int}")] — only matches integer IDs.
Preferred for Web APIs.
# Q89. Conventional Routing?
Routes are defined centrally in Program.cs using MapControllerRoute().
Uses route templates like "{controller}/{action}/{id?}".
The framework maps the URL segments to controller and action names automatically.
Typical for MVC apps rendering HTML views.
Less explicit than attribute routing — relies on naming conventions.
# Q90. Validation?
ASP.NET Core supports model validation via Data Annotations: [Required], [MaxLength], [Range], [EmailAddress].
With [ApiController], invalid models automatically return 400 Bad Request.
Manually check: if (!ModelState.IsValid) return BadRequest(ModelState).
Fluent Validation is a library providing more powerful, code-based validation rules.
Always validate on the server — never trust client-side validation alone.
# Q91. Fluent Validation?
FluentValidation is a library for building strongly typed validation rules in a fluent, readable syntax.
Create a class inheriting AbstractValidator<T> and define rules in the constructor.
Example: RuleFor(x => x.Email).NotEmpty().EmailAddress();
Integrates with ASP.NET Core's model validation pipeline via AddFluentValidation().
Preferred over Data Annotations for complex validation scenarios.
# Q92. Background Services?
Background services run long-running tasks in the background without blocking the request pipeline.
Implement IHostedService or inherit BackgroundService and override ExecuteAsync().
Registered in DI with builder.Services.AddHostedService<MyService>().
Examples: email sending, cache warming, message queue consumers, scheduled jobs.
Runs in the same process as the web app — for heavy work, consider separate worker services.

Hosted services are the same as background services — the terms are interchangeable.

# Q94. SignalR?
SignalR is a library for real-time bidirectional communication between server and clients.
Built on WebSockets with fallbacks (Server-Sent Events, Long Polling) for older browsers.
Server can push messages to clients without the client polling.
Use cases: live notifications, chat, dashboards, real-time collaboration.
Hub is the central class — clients connect to hubs and exchange messages.
# Q95. Caching?
Caching stores frequently accessed data in fast memory to reduce redundant computation or DB calls.
Types in ASP.NET Core: In-Memory Cache (local), Distributed Cache (Redis, SQL).
Apply caching with IMemoryCache (in-memory) or IDistributedCache (distributed).
Response caching caches full HTTP responses with [ResponseCache] attribute.
Key rule: cache data that is expensive to compute and doesn't change frequently.
# Q96. Memory Cache?
IMemoryCache stores data in the server's local memory.
Fast — no network round-trip.
Data is lost on app restart or when the server is recycled.
Not suitable for multi-server (load-balanced) environments — each server has its own cache.
Use for: reference data, config lookups, per-instance computed values.
# Q97. Distributed Cache?
IDistributedCache stores data in a shared external store accessible by all servers.
Common backends: Redis, SQL Server, NCache.
Suitable for load-balanced, multi-server environments.
Slightly slower than in-memory cache due to network round-trip.
Use for: session data, user-specific data, shared application state.
# Q98. Redis?
Redis is an in-memory, key-value data store used as a distributed cache, message broker, and queue.
Extremely fast — sub-millisecond reads/writes.
Supports strings, hashes, lists, sets, sorted sets, pub/sub, streams.
In ASP.NET Core, use StackExchange.Redis client with IDistributedCache or directly.
Common uses: session storage, caching, rate limiting counters, pub/sub messaging.
# Q99. API Security?
Use HTTPS everywhere — no exceptions.
Authenticate with JWT or OAuth 2.0.
Authorize with roles or policies.
Validate all inputs to prevent injection attacks.
Implement rate limiting to prevent abuse.
Restrict CORS to known origins.
Store secrets in environment variables or a secret manager.
Log and monitor for suspicious activity.
# Q100. API Performance Optimization?
Use async/await for all I/O operations — never block threads.
Add caching (Redis or memory cache) for expensive queries.
Use AsNoTracking() in EF Core for read-only queries.

Compress responses with response compression middleware.
Profile with Application Insights or MiniProfiler to find bottlenecks.
Use CDN for static content.

# Q101. REST API?
REST (Representational State Transfer) is an architectural style for building APIs over HTTP.
Uses standard HTTP verbs: GET (read), POST (create), PUT/PATCH (update), DELETE (remove).
Stateless — each request contains all the information the server needs.
Resources are identified by URIs: /api/users/5.
Returns data in JSON or XML format.
Key principles: statelessness, uniform interface, resource-based URLs, cacheable responses.
# Q102. SOAP vs REST?
SOAP is a protocol with strict standards — XML only, requires WSDL, has built-in security (WS-Security).
REST is an architectural style — flexible, uses JSON or XML, simpler, stateless.
SOAP has built-in ACID transactions and is better for enterprise/banking systems requiring strict contracts.
REST is lightweight, easy to consume, and the standard for modern web and mobile APIs.
Summary: SOAP = strict, heavy, enterprise. REST = lightweight, flexible, web-native.
# Q103. GET vs POST?
GET retrieves data — parameters in the URL query string. Safe, idempotent, cacheable.
POST sends data to create a resource — data in the request body. Not idempotent, not cacheable.
GET requests should never modify server state.
POST should be used for creating resources or operations with side effects.
Never send sensitive data in GET query strings — it appears in browser history and logs.
# Q104. PUT vs PATCH?
PUT replaces the entire resource with the provided data — idempotent.
PATCH applies partial updates — only the fields provided are updated.
PUT: if you omit a field, it is set to null or default.
PATCH: if you omit a field, it remains unchanged.
Use PATCH when you want to update only specific fields of a resource.
# Q105. DELETE?
DELETE removes a resource identified by the URI.
It is idempotent — deleting an already-deleted resource should return 404 or 204, not error.
Returns 204 No Content on success (no body) or 200 OK with a confirmation body.
Soft delete (marking as deleted) vs hard delete (actual removal) is a design choice.
Consider cascade delete behavior for related entities.
# Q106. Idempotent API?
An idempotent operation produces the same result no matter how many times it is called.
GET, PUT, DELETE are idempotent. POST is not.
PATCH can be idempotent depending on implementation.
Idempotency is important for retry logic — you can safely retry idempotent operations on network failure.
Implement idempotency keys for POST requests in payment or critical mutation APIs.
# Q107. HTTP Status Codes?
1xx: Informational. 2xx: Success. 3xx: Redirection. 4xx: Client Error. 5xx: Server Error.
200 OK: request succeeded. 201 Created: resource created. 204 No Content: success, no body.
400 Bad Request: invalid input. 401 Unauthorized: not authenticated. 403 Forbidden: authenticated but no permission.
404 Not Found: resource doesn't exist. 409 Conflict: resource conflict (duplicate).
500 Internal Server Error: unexpected server failure.
# Q108. 200 vs 201?
200 OK: the request succeeded and the response body contains the result — used for GET, PUT, PATCH.
201 Created: a new resource was created — used for POST. The response should include a Location header with the URI of the new resource.
Always return 201 (not 200) when a resource is created via POST.
# Q109. 401 vs 403?
401 Unauthorized: the request lacks valid authentication credentials. The client should authenticate.
403 Forbidden: the client is authenticated but does not have permission to access the resource.
401 = "Who are you? Please log in." 403 = "I know who you are, but you can't do this."
# Q110. 404 vs 500?
404 Not Found: the requested resource does not exist — this is a client error.
500 Internal Server Error: something unexpected went wrong on the server — this is a server error.
Return 404 when a specific resource is not found. Return 500 only for unhandled exceptions.
Always log 500 errors with full details internally; return a generic message to the client.
# Q111. DTO (Data Transfer Object)?
A DTO is a simple object used to transfer data between layers or between API and client.
It decouples the API contract from the internal domain/database model.
Prevents over-posting (client sending unexpected fields) and over-fetching (sending too much data).
Example: UserDto contains only Name and Email — not the Password hash stored in the User entity.
Always use DTOs for API request and response payloads.
# Q112. AutoMapper?
AutoMapper is a library that automatically maps between objects (e.g., Entity to DTO).
Eliminates repetitive manual property mapping code.
Configure mappings in a Profile class: CreateMap<User, UserDto>();
Use IMapper injected via DI to perform mappings: _mapper.Map<UserDto>(user);
Use for straightforward mappings. For complex mappings with logic, consider manual mapping.
# Q113. Pagination?
Pagination splits large result sets into pages to improve performance and API usability.
Common patterns: Offset-based (page number + page size) and Cursor-based (for large datasets).
API accepts page and pageSize query parameters; returns data + total count + page metadata.
In EF Core: .Skip((page - 1) * pageSize).Take(pageSize)
Always paginate APIs that can return large collections — never return unbounded lists.
# Q114. Sorting?
Allow clients to specify sort column and direction via query parameters.
Example: GET /api/users?sortBy=name&sortDir=asc
Apply sorting in EF Core using OrderBy / OrderByDescending based on the sort parameter.
Validate sort column names against allowed values to prevent SQL injection or errors.
Default to a sensible sort (e.g., created date descending) when no sort is specified.
# Q115. Filtering?
Allow clients to filter results via query parameters: GET /api/users?department=Engineering
Apply filters as WHERE conditions in EF Core queries.
Use IQueryable to build up filter conditions dynamically before executing the query.
Validate and sanitize filter inputs to prevent injection.
Combine filtering with pagination and sorting for fully flexible API queries.
# Q116. API Throttling?
API throttling limits the rate of requests a client can make to protect the API from overload.
Usually measured in requests per second, per minute, or per day.
Implemented in ASP.NET Core using the built-in rate limiting middleware (.NET 7+) or third-party libraries.
Returns 429 Too Many Requests when the limit is exceeded.
Throttling protects against abuse, DDoS, and accidental hammering from bugs.
# Q117. API Rate Limiting?
Rate limiting and throttling are often used interchangeably.
Rate limiting enforces quotas per client (by IP, API key, or user ID).
Strategies: Fixed Window (limit per time window), Sliding Window (rolling time window), Token Bucket (burst allowance).
In .NET 7+: use AddRateLimiter() and UseRateLimiter() with built-in policies.
Always return Retry-After header with 429 response so clients know when to retry.
# Q118. API Gateway?
An API Gateway is the single entry point for all client requests in a microservices architecture.
Handles: request routing, authentication, rate limiting, SSL termination, logging, load balancing.
Clients talk to the gateway; the gateway routes to the appropriate microservice.
Examples: AWS API Gateway, Azure API Management, Kong, Ocelot (.NET).
Simplifies client code — clients only need to know one endpoint.
# Q119. Versioning?
API versioning allows you to evolve your API without breaking existing clients.
Common strategies: URL path (/api/v1/users), query string (?api-version=1), HTTP header (api-version: 1).
Deprecate old versions gradually — provide migration guides and sunset dates.
URL versioning is the most visible and widely understood approach.
Use the Microsoft.AspNetCore.Mvc.Versioning package for seamless integration.
# Q120. OpenAPI?
OpenAPI (formerly Swagger) is a specification for describing RESTful APIs in a machine-readable format (YAML/JSON).
Allows auto-generation of documentation, client SDKs, and mock servers.
In ASP.NET Core, Swashbuckle generates the OpenAPI spec from your code automatically.
The OpenAPI spec file can be used by tools like Postman, API clients, and code generators.
Industry standard for API documentation and contract-first API design.
# Q121. Secure API Design?
Use HTTPS for all communication.
Authenticate every request (JWT, API keys, OAuth).
Authorize based on roles or policies.
Validate and sanitize all inputs.
Implement rate limiting.
Use CORS to restrict allowed origins.
Never expose sensitive data in error messages.
Store secrets in environment variables or a secret manager.
Audit and log all sensitive operations.
# Q122. Exception Handling?
Use global exception handling middleware to catch all unhandled exceptions.
Log the full exception details internally.
Return a clean Problem Details response (RFC 7807) to the client.
Never expose stack traces or internal error details to the client.
Use specific HTTP status codes: 400 for validation errors, 404 for not found, 500 for unexpected errors.
# Q123. Correlation IDs?
A Correlation ID is a unique identifier attached to each request to trace it across services and logs.
Generated at the API gateway or first entry point; passed in request headers (X-Correlation-ID).
All downstream services log this ID along with their own log entries.
Enables end-to-end request tracing in distributed systems.
Essential for debugging issues in microservices where a single operation spans multiple services.
# Q124. Logging APIs?
Log every significant request and response: method, path, status code, duration.
Include correlation IDs to trace requests across services.
Use structured logging (Serilog) so logs can be queried and filtered.
Do not log sensitive data: passwords, tokens, PII.
Centralize logs to a log aggregation system: Elasticsearch, Azure Monitor, CloudWatch.
# Q125. Retry Policies?
Retry policies automatically retry failed operations a specified number of times.
Used for transient failures: network timeouts, temporary service unavailability.
Implement using Polly: Policy.Handle<HttpRequestException>().WaitAndRetryAsync(3, attempt => TimeSpan.FromSeconds(attempt));
Use exponential backoff with jitter — don't retry immediately and don't retry all at the same time.
Only retry idempotent operations — retrying POST creates duplicates.
# Q126. Polly?
Polly is a .NET resilience and transient fault handling library.
Provides: Retry, Circuit Breaker, Timeout, Bulkhead Isolation, Fallback, and Hedging policies.
Integrates with HttpClientFactory in ASP.NET Core for resilient HTTP calls.
Example: AddPolicyHandler(GetRetryPolicy()) on an HttpClient registration.
Essential for production-grade microservice communication.
# Q127. Circuit Breaker?
The circuit breaker pattern stops calling a failing service after a threshold of failures.
States: Closed (normal), Open (failing — reject immediately), Half-Open (test recovery).
When open, calls fail fast without waiting for timeout — prevents cascading failures.
After a timeout, it enters Half-Open and allows a test call through.
Implemented with Polly: Policy.Handle<Exception>().CircuitBreakerAsync(5, TimeSpan.FromSeconds(30));
# Q128. Bulkhead Pattern?
The bulkhead pattern isolates failures in one part of the system from affecting others.
Named after ship compartments — a breach in one compartment doesn't sink the ship.
In APIs: limit concurrent calls per service to prevent one slow service from consuming all threads.
Implemented with Polly's BulkheadAsync policy.
Ensures degraded performance in one area doesn't cascade into total system failure.
# Q129. Timeout Pattern?
The timeout pattern sets a maximum wait time for an operation — if it exceeds the limit, cancel it.
Prevents threads from being held indefinitely waiting for a slow dependency.
Implemented with Polly: Policy.TimeoutAsync(TimeSpan.FromSeconds(5));
Always combine timeout with retry and circuit breaker for comprehensive resilience.
Set timeouts based on SLAs — not too short (false positives) and not too long (wastes resources).
# Q130. Retry Pattern?
The retry pattern re-attempts a failed operation with a delay.
Use for: transient network errors, temporary service unavailability, rate limit responses (429).
Strategies: immediate retry, fixed delay, exponential backoff, exponential backoff with jitter.
Jitter adds randomness to the delay to prevent thundering herd — all retrying at the same time.
Only retry on known transient errors — not on permanent errors like 400 Bad Request.

# Q131. Clustered Index?
A clustered index defines the physical order of data rows in the table.
There can be only one clustered index per table.
The primary key automatically creates a clustered index unless otherwise specified.
Range queries (BETWEEN, >, <) perform very well on clustered indexes.
Key interview line: "Clustered index = data IS the index. The table rows are physically sorted by it."
# Q132. Non-Clustered Index?
A non-clustered index is a separate structure from the table data.
It contains the indexed column values and a pointer (row locator) to the actual data row.
Multiple non-clustered indexes can exist per table.
Lookup: SQL uses the index to find the row locator, then does a key lookup to fetch the full row.
Covering indexes eliminate the key lookup by including all needed columns in the index.
# Q133. Composite Index?
An index built on two or more columns.
The order of columns in the index matters significantly.
A composite index on (A, B) helps queries filtering on A or (A and B) but NOT on B alone.
Design composite indexes based on the actual query patterns.
The leading column should be the most selective or most commonly filtered column.
# Q134. Covering Index?
A covering index includes all the columns needed to satisfy a query — no table lookup required.
The query runs entirely from the index without touching the base table rows.
Add non-key columns using the INCLUDE clause: CREATE INDEX idx ON Employee(DeptId) INCLUDE (Name, Salary)
Dramatically improves performance for read-heavy queries.
Key interview line: "Covering index = the index has everything the query needs."
# Q135. Primary Key?
Uniquely identifies each row in a table.
Cannot be NULL.
Only one per table.
Automatically creates a clustered index (by default).
Enforces entity integrity.
# Q136. Foreign Key?
Enforces referential integrity between two tables.
A foreign key column references the primary key of another table.
Prevents orphaned rows — you cannot insert a child row without a matching parent.
Cascades can be defined: ON DELETE CASCADE, ON UPDATE CASCADE.
Key interview line: "Foreign key = link between tables. Prevents invalid references."
# Q137. Unique Key?
Ensures all values in a column (or combination) are unique.
Allows one NULL (unlike primary key which does not allow NULL).
Creates a non-clustered index automatically.
Multiple unique constraints are allowed per table.
Use for: email columns, usernames, employee codes.
# Q138. Candidate Key?
A candidate key is any column or set of columns that can uniquely identify a row.
A table can have multiple candidate keys.
The chosen candidate key becomes the primary key; others remain as alternate keys.
Example: in an Employee table, both EmployeeId and Email can be candidate keys.
# Q139. Surrogate Key?
A surrogate key is an artificial, system-generated key — not derived from business data.
Usually an auto-incrementing integer (IDENTITY) or a GUID.
Has no business meaning — purely for row identification.
Preferred over natural keys because they never change and are always unique.
Example: EmployeeId INT IDENTITY(1,1) is a surrogate key.
# Q140. Constraints?
Constraints enforce rules on data in a table.
Types: NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY, CHECK, DEFAULT.
CHECK constraint: CHECK (Salary > 0) — enforces a condition on column values.
DEFAULT constraint: DEFAULT GETDATE() — provides a default value if none is supplied.
Constraints are enforced at the database level — the database rejects invalid data automatically.
# Q141. Normalization?
The process of organizing database tables to reduce redundancy and improve data integrity.
Ensures each piece of data is stored in only one place.
Achieved by decomposing tables and establishing proper relationships.
Reduces update anomalies — changing data in one place propagates correctly everywhere.
Key interview line: "Normalization = remove redundancy. Every fact stored once."
# Q142. 1NF (First Normal Form)?
A table is in 1NF when: each column contains atomic (indivisible) values.
No repeating groups or arrays in a single column.
Each row is unique (a primary key exists).
Example violation: storing multiple phone numbers in one column.
Fix: create a separate PhoneNumbers table with a foreign key back to the Employee.
# Q143. 2NF (Second Normal Form)?
A table is in 2NF when it is in 1NF and every non-key column is fully dependent on the entire primary key.
Applies only to tables with composite primary keys.
Partial dependency: a non-key column depends on only part of the composite key.
Fix: split the table so each non-key column depends on the full primary key.
Example: in an OrderItem table, ProductName depends only on ProductId (not the full composite key of OrderId + ProductId) — violates 2NF.
# Q144. 3NF (Third Normal Form)?
A table is in 3NF when it is in 2NF and no non-key column depends on another non-key column (transitive dependency).
Transitive dependency: A → B → C, where A is the key, B and C are non-key.
Fix: move the transitively dependent columns to a separate table.
Example: Employee has DeptId and DeptName — DeptName depends on DeptId, not on EmployeeId. Move DeptName to a Department table.
# Q145. BCNF (Boyce-Codd Normal Form)?
A stronger version of 3NF.
A table is in BCNF when for every functional dependency A → B, A must be a superkey.
Handles edge cases that 3NF doesn't cover — mainly overlapping candidate keys.
Most tables in 3NF are already in BCNF.
Used in theoretical design discussions — mention it as a bonus point in interviews.
# Q146. Denormalization?
Intentionally adding redundancy to a normalized database for performance.
Reduces expensive JOINs by storing data together that would normally be in separate tables.
Used in read-heavy reporting databases, data warehouses, and analytics (OLAP).
Trade-off: faster reads but slower writes, potential data inconsistency.
Key interview line: "OLTP = normalize for integrity. OLAP/Reporting = denormalize for read speed."
# Q147. CTE (Common Table Expression)?
A CTE is a temporary, named result set defined using the WITH keyword.
Exists only for the duration of the query — not stored in the database.
Makes complex queries more readable by breaking them into named logical parts.
Supports recursion — useful for hierarchical data like org charts or category trees.
Example: WITH CTE AS (SELECT ...) SELECT * FROM CTE WHERE ...
# Q148. Recursive CTE?
A recursive CTE references itself to process hierarchical or recursive data.
Structure: anchor member (base case) + recursive member (references the CTE itself) + termination condition.
Used for: org charts, bill of materials, folder hierarchies, graph traversal.
Example: find all employees under a manager recursively.
Always include a MAXRECURSION option to prevent infinite loops.
# Q149. Temp Table?
A temp table is created in TempDB using # prefix: CREATE TABLE #Temp (...)
Persists for the duration of the current session or connection.
Supports indexes and statistics — useful for large intermediate data sets.
Can be referenced from called stored procedures in the same session.
Use for complex multi-step queries that need intermediate storage.
# Q150. Table Variable?
Declared with DECLARE @TableVar TABLE (...).
Scoped to the current batch only — goes out of scope after the batch ends.
No statistics, no indexes (except primary key).
Faster for small data sets — less overhead than temp tables.
Not affected by transaction rollback — changes persist even if the transaction is rolled back.
# Q151. Stored Procedure?
A stored procedure is a precompiled set of SQL statements stored in the database.
Accepts input parameters, output parameters, and can return result sets.
Executes faster because the execution plan is compiled and cached.
Reduces network traffic — one round trip to run multiple SQL statements.
Can contain control flow: IF/ELSE, WHILE, TRY/CATCH.
# Q152. Function?
SQL Server functions return a value: scalar (single value) or table-valued (a table).
Can be used inline in SELECT, WHERE, and JOIN clauses.
Cannot modify data — no INSERT, UPDATE, DELETE, or DDL inside a function.
More composable than stored procedures — can be used in queries directly.
Types: Scalar functions, Inline Table-Valued Functions (ITVF), Multi-Statement Table-Valued Functions.
# Q153. Trigger?
A trigger is SQL code that automatically executes in response to INSERT, UPDATE, or DELETE events on a table.
AFTER trigger: runs after the event. INSTEAD OF trigger: replaces the event.
Used for: audit logging, enforcing business rules, replication.
Has access to INSERTED and DELETED logical tables for new and old row data.
Use carefully — hidden behavior can make debugging difficult.
# Q154. View?
A view is a named, saved SQL query that acts like a virtual table.
Does not store data by itself (unless indexed).
Simplifies complex queries, provides security (hide underlying tables), and abstracts schema changes.
Updatable views allow INSERT/UPDATE/DELETE under certain conditions.
Key interview line: "View = named reusable query. Virtual table."
# Q155. Indexed View?
An indexed view (materialized view) has a clustered index created on it — SQL Server stores the results on disk.
Dramatically improves query performance for expensive aggregations and joins.
SQL Server automatically keeps the view data in sync with base table changes.
Trade-off: faster reads but slower writes (index must be updated on every base table change).
Use for heavy read scenarios with expensive calculations.
# Q156. Cursor?
A cursor is a database object that allows row-by-row processing of a result set.
Very slow compared to set-based SQL operations — avoid in most cases.
Use cases: when row-by-row processing is truly required (complex calculations per row).
Alternatives: set-based queries with window functions, CTEs, or application-level processing.
Key interview line: "Cursors are slow. Always prefer set-based operations over cursors."
# Q157. Execution Plan?
The execution plan shows how SQL Server will execute a query — which indexes to use, join types, scan vs seek.
View in SSMS: Ctrl+M (graphical plan) or SET STATISTICS IO ON (text plan).
Index Seek = efficient (uses index to find specific rows). Index Scan = less efficient (scans all rows in index). Table Scan = most expensive.
Use the execution plan to identify bottlenecks: missing indexes, expensive hash joins, key lookups.
Key tip: "Look for table scans and key lookups — these are the biggest performance killers."
# Q158. Parameter Sniffing?
SQL Server caches the execution plan based on the parameter values used the first time a stored procedure runs.
On subsequent calls with different parameter values, the cached plan may be suboptimal.
Symptoms: a SP that runs fast sometimes and slow other times.
Fix: use OPTION(RECOMPILE) to force a new plan each time, or use OPTIMIZE FOR hint, or use local variables.
# Q159. Deadlock?
A deadlock occurs when two transactions each hold a lock that the other needs — neither can proceed.
SQL Server automatically detects deadlocks and kills the victim transaction (the one with less work done).
Prevention: always access tables in a consistent order. Keep transactions short. Use appropriate isolation levels.
The error returned is: Transaction was deadlocked on lock resources with another process.
Index properly — more specific index access reduces lock contention.
# Q160. Blocking?
Blocking occurs when one transaction holds a lock that another transaction is waiting for.
Unlike a deadlock, blocking eventually resolves when the first transaction commits or rolls back.
Symptoms: slow queries, timeouts, accumulating waits.
Identify with: sys.dm_exec_requests, sys.dm_os_waiting_tasks, Activity Monitor in SSMS.
Fix: optimize long transactions, add appropriate indexes, use READ COMMITTED SNAPSHOT isolation.
# Q161. Find Duplicate Records?
SELECT Email, COUNT(*) FROM Employee GROUP BY Email HAVING COUNT(*) > 1
This groups by the column you want to check for duplicates and returns groups with more than one occurrence.
To see all duplicate rows: use ROW_NUMBER() OVER (PARTITION BY Email ORDER BY Id) and filter where RN > 1.
# Q162. Find Nth Highest Salary?
SELECT Salary FROM (SELECT DISTINCT Salary, DENSE_RANK() OVER (ORDER BY Salary DESC) AS r FROM Employee) x WHERE r = N
Replace N with the rank you want.
DENSE_RANK handles ties: if two employees share the 2nd salary, DENSE_RANK assigns both rank 2 and the next unique salary gets rank 3.
# Q163. ROW_NUMBER?
ROW_NUMBER() assigns a unique sequential number to each row within a partition.
Syntax: ROW_NUMBER() OVER (PARTITION BY DeptId ORDER BY Salary DESC)
Does not handle ties — rows with equal values get different sequential numbers.
Used for: pagination, removing duplicates, ranking within groups.
# Q164. RANK?
RANK() assigns a rank to each row with gaps for tied values.
Example: if two rows tie for rank 1, the next row gets rank 3 (not 2).
Syntax: RANK() OVER (ORDER BY Salary DESC)
Use when you need Olympic-style ranking (1, 1, 3...).
# Q165. DENSE_RANK?
DENSE_RANK() assigns ranks without gaps for tied values.
Example: if two rows tie for rank 1, the next row gets rank 2 (not 3).
Syntax: DENSE_RANK() OVER (ORDER BY Salary DESC)
Use for finding Nth highest salary without gaps.
Preferred over RANK for most salary/ranking questions in interviews.
# Q166. LEAD?
LEAD() accesses a value from the next row without a self-join.
Syntax: LEAD(Salary, 1, 0) OVER (ORDER BY Id) — gets salary of the next row, defaults to 0 if none.
Used to compare current row value with the next row's value.
Useful for: detecting consecutive patterns, comparing current vs next period.
# Q167. LAG?
LAG() accesses a value from the previous row without a self-join.
Syntax: LAG(Salary, 1, 0) OVER (ORDER BY Id) — gets salary of the previous row.
Used to compare current row with the previous row.
Classic use: find employees whose salary increased from the previous record.
LEAD looks forward; LAG looks backward.
# Q168. MERGE?
MERGE performs INSERT, UPDATE, and DELETE in a single statement based on a match condition.
Source table compared to target table; rows are inserted if no match, updated if matched, deleted if not in source.
Useful for upsert (insert or update) operations in data synchronization scenarios.
Example: syncing a staging table with a production table.
Syntax: MERGE target USING source ON condition WHEN MATCHED THEN UPDATE WHEN NOT MATCHED THEN INSERT WHEN NOT MATCHED BY SOURCE THEN DELETE.
# Q169. UNION?
UNION combines result sets from two queries and removes duplicate rows.
Both queries must have the same number of columns with compatible data types.
Slower than UNION ALL because it performs a sort/distinct operation to remove duplicates.
Use UNION only when deduplication is required.
# Q170. UNION ALL?
UNION ALL combines result sets and keeps ALL rows including duplicates.
Faster than UNION — no sorting or duplicate removal.
Use UNION ALL when you know there are no duplicates or when duplicates are acceptable.
Key interview line: "Always prefer UNION ALL over UNION unless deduplication is explicitly needed."
# Q171. Query Optimization?
Check the execution plan — look for table scans, key lookups, implicit conversions.
Add appropriate indexes (clustered, non-clustered, covering).
Use SELECT with specific columns instead of SELECT *.
Avoid functions on indexed columns in WHERE: WHERE YEAR(HireDate) = 2020 prevents index use; use WHERE HireDate >= '2020-01-01'.
Use pagination to limit result sets.
Keep transactions short to reduce locking.
Avoid cursors — use set-based operations.
# Q172. Missing Index?
SQL Server's execution plan often includes a missing index suggestion.
Also check sys.dm_db_missing_index_details for missing index recommendations.
Do not blindly add all suggested indexes — evaluate the impact on write performance.
Each additional index slows down INSERT, UPDATE, DELETE operations on that table.
Balance read performance gains against write overhead.
# Q173. SQL Profiler?
SQL Server Profiler captures and analyzes database activity in real time.
Captures: queries, stored procedures, login events, deadlocks, errors.
Used for: finding slow queries, debugging performance issues, auditing.
Extended Events is the modern, lighter-weight replacement for SQL Profiler.
Key use: trace slow queries in production (use carefully — profiler has overhead).
# Q174. Query Store?
Query Store is built into SQL Server (2016+) and Azure SQL.
Automatically captures query plans and runtime statistics over time.
Detects plan regression — when a query suddenly starts using a worse execution plan.
Allows forcing a specific plan: EXEC sp_query_store_force_plan.
Used for: performance monitoring, troubleshooting parameter sniffing, tracking query degradation.
# Q175. Partitioning?
Table partitioning splits a large table into smaller, manageable pieces based on a partition key (usually a date).
Queries targeting a specific partition skip others entirely — partition elimination.
Improves performance for large tables with date-range queries.
Each partition can be on a different filegroup.
Example: an Orders table partitioned by year — querying 2024 orders only scans the 2024 partition.
# Q176. Transactions?
A transaction is a unit of work that is executed atomically — all or nothing.
Begin with BEGIN TRANSACTION; commit with COMMIT; roll back with ROLLBACK.
In EF Core: use context.Database.BeginTransactionAsync() for explicit multi-step transactions.
Transactions ensure data consistency across multiple related operations.
Keep transactions as short as possible to minimize locking and improve concurrency.
# Q177. Isolation Levels?
Isolation levels control how transactions interact with concurrent reads and writes.
READ UNCOMMITTED: can read uncommitted (dirty) data. Fastest, least safe.
READ COMMITTED (default): only reads committed data.
REPEATABLE READ: data read cannot change during the transaction.
SERIALIZABLE: highest isolation — full table lock, no phantom reads. Most restrictive.
READ COMMITTED SNAPSHOT (RCSI): uses row versions — readers don't block writers. Recommended for most apps.
# Q178. ACID Properties?
ACID ensures reliable database transactions.
Atomicity: all operations succeed or none do.
Consistency: the database moves from one valid state to another.
Isolation: concurrent transactions don't interfere with each other.
Durability: committed transactions survive system failures.
Key interview line: "ACID = Atomicity, Consistency, Isolation, Durability."
# Q179. Dirty Reads?
A dirty read occurs when one transaction reads uncommitted data written by another transaction.
If the second transaction rolls back, the first transaction has read data that never officially existed.
Caused by READ UNCOMMITTED isolation level.
Prevented by READ COMMITTED and higher isolation levels.
Generally unacceptable in business applications — avoid READ UNCOMMITTED in production.
# Q180. Phantom Reads?
A phantom read occurs when a transaction re-executes a query and finds new rows that were inserted by another transaction.
The "phantom" rows weren't there on the first read but appear on the second read.
Occurs under REPEATABLE READ isolation — rows can be inserted but not modified.
Prevented by SERIALIZABLE isolation.
READ COMMITTED SNAPSHOT prevents dirty reads and phantom reads efficiently without heavy locking.
@react
# Q181. Virtual DOM?
React maintains a lightweight copy of the real DOM in memory.
On state change, React creates a new virtual DOM tree and diffs it with the previous one.
Only the changed parts are updated in the real DOM — this is called reconciliation.
Much faster than directly manipulating the real DOM for every change.
Key interview line: "Virtual DOM = diff + minimal real DOM updates = performance."
# Q182. JSX?
JSX (JavaScript XML) is a syntax extension for JavaScript used in React.
It lets you write HTML-like syntax inside JavaScript.
JSX is compiled to React.createElement() calls by Babel.
Example: const element = <h1>Hello</h1> compiles to React.createElement('h1', null, 'Hello').
JSX is not required but makes React code much more readable.
# Q183. Functional Components?
Functional components are plain JavaScript functions that return JSX.
They accept props as an argument.
Modern React — all new components should be functional.
Use hooks (useState, useEffect) for state and lifecycle features.
Simpler, less boilerplate than class components.
# Q184. Class Components?
Class components extend React.Component and implement the render() method.
Use this.state for state and lifecycle methods (componentDidMount, componentDidUpdate, etc.).
Verbose — require binding methods and managing this.
Legacy approach — functional components with hooks have replaced them.
You may still see them in older codebases; understand how they work.
# Q185. Props?
Props are read-only inputs passed from a parent component to a child component.
The child cannot modify its own props — they flow down the component tree.
Used to pass data and callback functions to child components.
Changing a parent's state with new prop values causes the child to re-render.
Key interview line: "Props = external input from parent. Read-only in the child."
# Q186. State?
State is data managed inside a component that can change over time.
Changing state via setState (class) or setters from useState (functional) triggers a re-render.
State should be the minimal representation of data needed for the UI.
Lift state up when multiple components need access to the same state.
Key interview line: "State = internal, mutable data. Changing state re-renders the component."
# Q187. Controlled Components?
A controlled component is a form element whose value is driven by React state.
The input's value attribute is bound to state; onChange updates the state.
React is the single source of truth for the form field value.
Every keystroke triggers a state update and re-render.
Preferred approach — gives full control over form data.
# Q188. Uncontrolled Components?
An uncontrolled component manages its own state internally in the DOM.
Access the value using a ref: const inputRef = useRef(); then inputRef.current.value.
Less React-idiomatic — the DOM controls the input, not React.
Useful for simple forms or integrating with non-React code.
Use controlled components in most cases; uncontrolled for quick reads when no live validation is needed.
# Q189. Lifting State Up?
When two sibling components need to share state, move (lift) the state to their common parent.
The parent passes the state as props and the setter function as a callback.
Ensures a single source of truth for shared data.
Example: a filter input and a list that responds to it — both connect to shared state in the parent.
# Q190. Prop Drilling?
Prop drilling occurs when props are passed through many intermediate components that don't use them.
The data is just being passed down to reach a deeply nested component.
Problems: verbose code, tight coupling, makes refactoring hard.
Solutions: Context API for moderate sharing, Redux for complex global state.
Key interview line: "Prop drilling = passing props through many layers just to reach a deep component."
# Q191. useState?
Declares a state variable in a functional component.
Returns [currentValue, setterFunction]: const [count, setCount] = useState(0)
Calling the setter triggers a re-render with the new value.
State updates are asynchronous — batched by React for performance.
Each useState call creates an independent state variable.
# Q192. useEffect?
Runs side effects after the component renders.
Dependency array controls when it runs: [] = once on mount. [dep] = when dep changes. No array = every render.
Return a cleanup function to handle unsubscriptions, clearing timers, or cancelling requests.
Covers componentDidMount, componentDidUpdate, and componentWillUnmount in one hook.
Common uses: API calls, subscriptions, DOM manipulation after render.
# Q193. useMemo?
Memoizes the result of an expensive calculation.
Recalculates only when its dependencies change.
Syntax: const result = useMemo(() => expensiveCalc(data), [data])
Prevents redundant calculations on every re-render.
Use only for genuinely expensive computations — premature optimization adds complexity.
# Q194. useCallback?
Memoizes a function definition — returns the same function reference unless dependencies change.
Prevents child components from re-rendering unnecessarily when a parent re-renders.
Syntax: const handleClick = useCallback(() => { doSomething(id); }, [id])
Use when passing callbacks to child components wrapped in React.memo.
useCallback = cache a function. useMemo = cache a value.
# Q195. useRef?
Returns a mutable ref object whose .current property persists across re-renders without causing re-renders.
Two primary uses: accessing DOM elements directly (inputRef.current.focus()) and storing mutable values that don't trigger re-renders (timers, previous values).
Does not cause re-render when .current is changed — unlike state.
Key interview line: "useRef = stable reference that doesn't trigger re-renders."
# Q196. useReducer?
An alternative to useState for complex state logic.
Takes a reducer function and initial state; returns [state, dispatch].
The reducer function takes current state and an action, returns new state.
Better than useState when next state depends on previous state in complex ways.
Similar pattern to Redux — useful for local component-level complex state.
# Q197. Custom Hooks?
Custom hooks are reusable functions that encapsulate hook logic.
Names must start with use: useFetch, useForm, useDebounce.
Can call other hooks inside them.
Share stateful logic across multiple components without duplicating code.
Example: a useFetch hook encapsulates useEffect + useState + loading/error state.
# Q198. Context API?
Context provides a way to pass data through the component tree without prop drilling.
Create a context: const ThemeContext = React.createContext().
Provide a value at a high level: <ThemeContext.Provider value={theme}>
Consume with useContext: const theme = useContext(ThemeContext).
Use for: theme, locale, authenticated user — data that is truly global but changes infrequently.
# Q199. React.memo?
React.memo is a higher-order component that memoizes a functional component.
Prevents the component from re-rendering if its props haven't changed.
Uses shallow comparison of props by default.
Combine with useCallback for stable callback props to maximize effectiveness.
Only use when you have a measurable performance problem — don't premature optimize.
# Q200. React.lazy?
React.lazy enables lazy loading of a component — it is loaded only when it is first rendered.
Syntax: const MyComp = React.lazy(() => import('./MyComp'))
Must be wrapped in Suspense with a fallback: <Suspense fallback={<Spinner/>}><MyComp/></Suspense>
Reduces initial bundle size — improves time to interactive.
Works with code splitting — the component is a separate JavaScript chunk.
# Q201. Suspense?
Suspense lets components wait for something before rendering and shows a fallback meanwhile.
Currently works with React.lazy for code splitting and data fetching in React 18+.
Syntax: <Suspense fallback={<Loading/>}><LazyComponent/></Suspense>
The fallback is rendered while the lazy component is loading.
Part of React's concurrent features strategy for async rendering.
# Q202. Error Boundary?
Error boundaries catch JavaScript errors in their child component tree and display a fallback UI.
Implemented as class components with componentDidCatch and static getDerivedStateFromError.
No functional component equivalent yet (as of React 18).
Used to prevent a single component crash from breaking the entire app.
Wrap top-level routes and high-risk components with Error Boundaries.
# Q203. Reconciliation?
Reconciliation is React's process of comparing the new virtual DOM with the previous one and updating only changed parts.
React uses a diffing algorithm: assumes elements of different types produce different trees.
Key hint: when rendering lists, provide unique key props so React can identify items efficiently.
Without keys, React may re-render entire lists unnecessarily.
Keys should be stable, unique IDs — not array indexes (indexes cause bugs when the list reorders).
# Q204. Keys?
Keys help React identify which items in a list have changed, been added, or removed.
Must be unique among siblings — not globally unique.
Use stable IDs (database IDs, UUIDs) as keys — not array indexes.
Using indexes as keys causes bugs when items are reordered or removed.
Key interview line: "Keys = React's way of efficiently tracking list items across re-renders."
# Q205. Fragment?
React.Fragment (or shorthand <></>) allows returning multiple elements without adding an extra DOM node.
Prevents unnecessary wrapper divs in the rendered HTML.
Example: return (<><h1>Title</h1><p>Content</p></>)
Use the long form <React.Fragment key={id}> when you need a key prop (for lists).
# Q206. Redux?
Redux is a predictable state management library for JavaScript apps.
Single store holds the entire application state.
Actions describe what happened: { type: 'INCREMENT', payload: 1 }
Reducers specify how state changes in response to actions — pure functions.
Components dispatch actions and subscribe to state via useSelector and useDispatch.
# Q207. Redux Toolkit?
The official, modern way to use Redux — significantly less boilerplate than vanilla Redux.
createSlice combines action creators and reducer in one place.
configureStore sets up the store with good defaults (Redux DevTools, middleware).
Uses Immer internally — allows writing "mutating" code that is actually immutable.
Always use Redux Toolkit in new projects.
# Q208. Store?
The Redux store is the single source of truth for the entire application state.
Created with configureStore() in Redux Toolkit.
Provides: getState() to read state, dispatch() to send actions, subscribe() to listen for changes.
Components access state via useSelector() and dispatch actions via useDispatch().
# Q209. Reducer?
A reducer is a pure function that takes the current state and an action, and returns the new state.
