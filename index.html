Must be pure: same input always produces same output, no side effects.
Never mutate state directly — return a new state object.
With Redux Toolkit's createSlice, you can write "mutating" code — Immer handles immutability.
Key interview line: "Reducer = pure function: (state, action) => newState."
# Q210. Action?
An action is a plain JavaScript object describing an event that occurred.
Must have a type property: { type: 'user/login', payload: { userId: 1 } }.
Dispatched via dispatch(action) to trigger a state change.
In Redux Toolkit, createSlice auto-generates action creators for each reducer.
Actions are serializable — no functions, Promises, or class instances as actions.
# Q211. Middleware (Redux)?
Redux middleware intercepts actions before they reach the reducer.
Used for: async operations (Thunk), logging, analytics, error handling.
Applied in configureStore: middleware: [thunk, logger]
Redux Toolkit includes Redux Thunk by default.
Middleware can dispatch additional actions or stop an action from reaching the reducer.
# Q212. Thunk?
Redux Thunk middleware allows dispatching a function instead of a plain action object.
The function receives dispatch and getState as arguments.
Used for async operations: API calls, side effects.
Example: dispatch(fetchUsers()) — fetchUsers is a thunk that calls an API and dispatches result actions.
Redux Toolkit's createAsyncThunk simplifies async thunk creation with pending/fulfilled/rejected states.
# Q213. Saga?
Redux Saga is middleware for handling complex async flows using generator functions.
More powerful than Thunk for complex scenarios: sequential steps, cancellation, race conditions, retries.
Uses ES6 generators (function*) and yield for step-by-step async logic.
Steeper learning curve than Thunk — use Thunk for simple async, Saga for complex workflows.
Example use: multi-step authentication flow with retry and cancellation.
# Q214. Routing?
React Router provides client-side routing for React SPAs.
Renders different components based on the current URL without full page reloads.
Core components: BrowserRouter, Routes, Route, Link, NavLink.
Hooks: useNavigate (programmatic navigation), useParams (route params), useLocation (current location).
Use BrowserRouter for most apps; HashRouter for environments that can't handle URL rewriting.
# Q215. Protected Routes?
A protected route redirects unauthenticated users to the login page.
Implemented as a wrapper component that checks authentication state.
If authenticated: renders the child component. If not: redirects to /login using Navigate.
Pattern: <ProtectedRoute><Dashboard/></ProtectedRoute>
Combine with Redux or Context to access the authentication state globally.
# Q216. Code Splitting?
Code splitting breaks the JavaScript bundle into smaller chunks loaded on demand.
Webpack/Vite split the bundle automatically when you use React.lazy() and dynamic imports.
Users only download the JavaScript for the current page or feature.
Results in a smaller initial bundle and faster time to interactive.
Key interview line: "Code splitting = load less JavaScript upfront. Users get what they need when they need it."
# Q217. Lazy Loading?
Lazy loading in React means loading components only when they are needed.
Achieved with React.lazy(() => import('./Component')) and Suspense.
Combine with route-level code splitting for maximum effect.
Images can also be lazy loaded using the loading="lazy" HTML attribute.
Key interview line: "React.lazy + Suspense = on-demand component loading."
# Q218. Debouncing?
Debouncing delays a function call until after a specified time has passed since the last invocation.
Used for: search inputs — wait for the user to stop typing before firing the API call.
Implementation: use setTimeout in a custom hook or use the Lodash debounce function.
Prevents sending a new API request on every keystroke.
Key interview line: "Debounce = wait until the user stops, then act."
# Q219. Throttling?
Throttling limits how often a function can be called — ensures it runs at most once per time window.
Used for: scroll events, resize events, preventing double form submission.
Different from debouncing: throttle fires at regular intervals, debounce fires after silence.
Implementation: use Lodash throttle or a custom hook with useRef to track the last call time.
Key interview line: "Throttle = fire at most once per N milliseconds, regardless of how many times triggered."
# Q220. React Performance Optimization?
Use React.memo to prevent re-renders of pure functional components.
Use useMemo for expensive computed values.
Use useCallback for stable function references passed to child components.
Lazy load heavy components with React.lazy.
Virtualize long lists with react-window or react-virtual — only render visible rows.
Avoid inline object and function creation in JSX — they create new references on every render.
Profile with React DevTools Profiler to find actual bottlenecks before optimizing.
@microservices
# Q221. What are Microservices?
Microservices is an architectural style where an application is built as a collection of small, independent services.
Each service owns a specific business capability, its own data, and its own deployment.
Services communicate via APIs (REST, gRPC) or messaging (queues, events).
Each service can be developed, deployed, scaled, and maintained independently.
Key interview line: "Each service owns its domain, its data, and its deployment pipeline."
# Q222. Monolith vs Microservices?
Monolith: all functionality in one deployable unit. Simple to develop and test initially.
Harder to scale specific components. A bug can bring down the whole app. Long build/deploy cycles.
Microservices: independently deployable, scalable, and maintainable services.
Adds complexity: distributed systems, network failures, data consistency, service discovery.
Rule: start with a well-structured monolith. Move to microservices when you have specific scaling or team independence needs.
# Q223. Service Discovery?
Service discovery allows microservices to find each other dynamically without hardcoded URLs.
Services register their address with a service registry (Consul, Eureka, AWS Cloud Map) on startup.
Other services query the registry to get the current address of needed services.
Client-side discovery: the client queries the registry and load balances itself.
Server-side discovery: the load balancer queries the registry and routes on behalf of the client.
# Q224. API Gateway?
An API gateway is the single entry point for all external client requests.
Handles: routing, authentication, SSL termination, rate limiting, logging, response caching.
Clients talk to the gateway; it routes requests to the appropriate microservice.
Examples: AWS API Gateway, Azure API Management, Kong, Nginx, Ocelot.
Simplifies client code and provides a centralized location for cross-cutting concerns.
# Q225. Service Registry?
A service registry is a database of all running service instances and their network addresses.
Services self-register on startup and deregister on shutdown.
The registry provides health checking to automatically remove failed instances.
Examples: Consul, Eureka (Netflix), AWS Cloud Map.
The API Gateway or service discovery mechanism queries the registry to find service instances.
# Q226. Distributed Transactions?
Distributed transactions coordinate changes across multiple services/databases atomically.
Traditional two-phase commit (2PC) is complex and often impractical in microservices.
The preferred approach is eventual consistency using the Saga Pattern.
Design around avoiding distributed transactions wherever possible — use events and compensation.
Key interview line: "Avoid distributed transactions in microservices. Use Saga and eventual consistency instead."
# Q227. Saga Pattern?
The Saga pattern manages long-running distributed transactions across multiple services using a series of local transactions.
Each step publishes an event; the next service reacts. If a step fails, compensating transactions roll back previous steps.
Two types: Choreography (event-driven, services react to events) and Orchestration (a central coordinator manages the flow).
Example: Order Service creates order → Payment Service charges card → Inventory Service reserves stock. If payment fails, Order Service compensates (cancels order).
# Q228. Event Driven Architecture?
Services communicate by publishing and consuming events through a message broker (Kafka, RabbitMQ, Azure Service Bus).
Producer publishes an event without knowing who consumes it — fully decoupled.
Consumers react to events asynchronously.
Enables loose coupling, scalability, and resilience.
Key trade-off: eventual consistency instead of immediate consistency.
# Q229. Message Queue?
A message queue is a form of asynchronous communication where producers send messages to a queue and consumers process them independently.
Decouples producers and consumers — they don't need to be available simultaneously.
Enables load leveling: consumers process at their own pace.
Examples: RabbitMQ, AWS SQS, Azure Service Bus, Kafka.
Key use cases: email sending, order processing, background jobs.
# Q230. Eventual Consistency?
Eventual consistency means that all services will eventually have a consistent view of the data — but not necessarily immediately.
Accepted trade-off in distributed systems for availability and scalability (see CAP theorem).
Achieved through event-driven updates — downstream services eventually process events and update their data.
Design UI to handle eventual consistency: show optimistic updates, pending states.
Key interview line: "Eventual consistency = the system will become consistent, just not instantly."
# Q231. Circuit Breaker?
The circuit breaker pattern prevents cascading failures by stopping calls to a failing service.
States: Closed (normal), Open (service is failing — fail fast), Half-Open (testing recovery).
When a threshold of failures is reached, the circuit opens and subsequent calls fail immediately.
After a timeout, the circuit enters Half-Open and allows one test request through.
Implemented in .NET with Polly: Policy.Handle<Exception>().CircuitBreakerAsync(5, TimeSpan.FromSeconds(30)).
# Q232. Retry Pattern?
Retry automatically re-attempts a failed operation after a delay.
Used for transient failures: network timeouts, temporary service unavailability.
Use exponential backoff with jitter to avoid thundering herd.
Only retry idempotent operations — retrying POST creates duplicate records.
Polly: Policy.Handle<HttpRequestException>().WaitAndRetryAsync(3, attempt => TimeSpan.FromSeconds(Math.Pow(2, attempt)));
# Q233. Bulkhead Pattern?
Isolates failures in one subsystem from spreading to others.
Limits concurrent calls to a service to prevent resource exhaustion.
Example: if the Email service is slow, it shouldn't consume all available threads and starve the Order service.
Implemented with Polly's BulkheadAsync or by using separate HTTP client pools per service.
Named after watertight compartments in a ship hull — a breach in one doesn't sink the ship.
# Q234. CQRS?
CQRS (Command Query Responsibility Segregation) separates read and write operations into different models.
Commands: change state (Create, Update, Delete) — go through the write model.
Queries: read state — go through the read model, often optimized for reading.
Allows independent scaling of reads and writes.
Often combined with Event Sourcing for the write model.
# Q235. Event Sourcing?
Event sourcing stores the history of all state changes as a sequence of immutable events — not the current state.
The current state is derived by replaying all events from the beginning.
Provides a full audit trail automatically.
Events are facts — they never change. New events are appended.
Excellent for audit logging, financial systems, and systems where history matters.
# Q236. Sidecar Pattern?
The sidecar pattern deploys a helper service alongside the main service in the same pod/container.
The sidecar handles cross-cutting concerns: logging, monitoring, service mesh proxy, secret management.
The main service doesn't need to know about these concerns — the sidecar handles them transparently.
Examples: Envoy proxy as a sidecar in a service mesh (Istio), log shipper sidecar.
Common in Kubernetes deployments.
# Q237. Aggregator Pattern?
The aggregator pattern combines results from multiple microservice calls into a single response.
Clients call one aggregator service instead of multiple services directly.
The aggregator calls multiple downstream services, combines their results, and returns a unified response.
Reduces client complexity and number of network calls from the client.
Can be implemented in the API Gateway or as a dedicated Backend-for-Frontend (BFF) service.
# Q238. Strangler Pattern?
The strangler fig pattern incrementally migrates a monolith to microservices.
New features are built as microservices. Over time, existing monolith functionality is migrated out.
The monolith shrinks (strangles) as microservices grow around it.
The API Gateway or routing layer directs traffic to either the monolith or microservices.
Low-risk migration strategy — the monolith remains functional throughout the migration.
# Q239. Database per Service?
Each microservice owns its own database — no other service can access it directly.
Ensures loose coupling at the data layer.
Services can choose the best database type for their needs (SQL, NoSQL, graph).
Data sharing happens via APIs or events — not direct database queries.
Key challenge: joins and transactions across services require event-driven design and eventual consistency.
# Q240. Shared Database?
Multiple microservices share the same database.
Simpler to set up but creates tight coupling between services.
Schema changes to one service's tables can break other services.
Anti-pattern in microservices — use only as a stepping stone during migration or for truly shared reference data.
Goal: move toward database per service for full service independence.
# Q241. Logging Strategy?
Each service logs to stdout/stderr in a structured format (JSON).
A centralized log aggregation system (ELK Stack, Splunk, CloudWatch) collects and indexes logs.
Every log entry should include: service name, timestamp, log level, correlation ID, user ID.
Use correlation IDs to trace a request across multiple service logs.
Never log sensitive data: passwords, tokens, PII.
# Q242. Monitoring?
Monitor service health: CPU, memory, error rates, latency, throughput.
Use APM (Application Performance Monitoring) tools: Datadog, New Relic, Application Insights.
Define SLOs (Service Level Objectives) and alert on SLO breaches.
Monitor business metrics alongside technical metrics.
Implement health check endpoints (/health) for automated monitoring and load balancer routing.
# Q243. Distributed Tracing?
Distributed tracing follows a request as it travels through multiple microservices.
Each service adds trace context (trace ID, span ID) to the request and logs it.
Tools: Jaeger, Zipkin, AWS X-Ray, OpenTelemetry.
A trace visualizes the full end-to-end journey of a request and highlights slow or failing spans.
Essential for debugging performance issues in microservices.
# Q244. Correlation IDs?
A correlation ID is a unique ID assigned to each request at the entry point.
Passed in headers (X-Correlation-ID) across all downstream service calls.
Every service logs the correlation ID with its log entries.
Enables end-to-end request tracing across all services in a single search.
Key interview line: "Correlation ID = thread of identity tying all logs of one request together."
# Q245. Health Checks?
Each microservice exposes a /health endpoint returning its operational status.
Returns: Healthy, Degraded, or Unhealthy with details.
Used by: load balancers (route only to healthy instances), Kubernetes (liveness and readiness probes), orchestration platforms.
Check: database connectivity, dependency availability, disk space, memory.
In ASP.NET Core: AddHealthChecks() and MapHealthChecks("/health").
# Q246. Docker?
Docker packages an application and all its dependencies into a container — a lightweight, isolated runtime.
A Dockerfile defines the image: base OS, dependencies, app files, entry point.
Docker image = blueprint. Container = running instance of an image.
Ensures consistency: the container runs the same everywhere (dev, staging, production).
Key interview line: "Docker = consistent, portable packaging. Works the same on every machine."
# Q247. Kubernetes?
Kubernetes (K8s) is a container orchestration platform for deploying and managing containerized applications at scale.
Pod: smallest unit — one or more containers running together.
Deployment: manages desired number of pod replicas and handles rolling updates.
Service: provides stable networking and load balancing to a set of pods.
Ingress: manages external HTTP/HTTPS traffic routing to services.
# Q248. Scaling?
Horizontal scaling: add more instances of a service — preferred for microservices.
Vertical scaling: add more CPU/memory to an existing instance — limited and expensive.
Kubernetes Horizontal Pod Autoscaler (HPA) scales pods based on CPU/memory metrics.
Stateless services are easiest to scale — no session or local state to worry about.
Scale individual microservices independently based on their specific load.
# Q249. Resilience?
Resilience is the ability of a system to recover from failures and continue operating.
Achieve via: retries, circuit breakers, timeouts, bulkheads, fallbacks.
Design for failure — assume any service call can fail.
Use idempotent operations to enable safe retries.
Implement graceful degradation — the system continues with reduced functionality rather than completely failing.
# Q250. Fault Tolerance?
Fault tolerance means the system continues to operate correctly even when some components fail.
Achieved through redundancy (multiple instances), failover, circuit breakers, and fallback responses.
No single point of failure — every critical component has a redundant backup.
Health checks + load balancers automatically remove failed instances from rotation.
Key interview line: "Fault tolerance = design so that any component can fail without taking the whole system down."
@aws
# Q251. What is AWS Lambda?
AWS Lambda is a serverless compute service — you run code without provisioning or managing servers.
Upload your function code; Lambda runs it in response to triggers (API Gateway, SQS, EventBridge, S3).
Scales automatically — from zero to thousands of concurrent executions.
You pay only for the compute time used (per 100ms increments).
Ideal for event-driven, short-running workloads.
# Q252. Lambda Lifecycle?
Cold start: first invocation initializes the execution environment — downloads code, starts runtime.
Warm start: subsequent invocations reuse the initialized environment — much faster.
Lambda freezes the execution environment between invocations.
Initialize heavy resources (DB connections, SDK clients) outside the handler function for reuse across invocations.
Lambda has a maximum execution time of 15 minutes.
# Q253. Cold Start?
A cold start happens when Lambda needs to initialize a new execution environment.
Adds latency — typically 100ms to a few seconds depending on runtime and package size.
More common with compiled languages (Java) and large deployment packages.
Mitigation: use Provisioned Concurrency (keeps environments pre-warmed), keep packages small, use Lambda SnapStart (Java).
In .NET: .NET 6+ Native AOT reduces cold start significantly.
# Q254. API Gateway?
AWS API Gateway is a fully managed service for creating, managing, and securing REST, HTTP, and WebSocket APIs.
Acts as the front door for Lambda functions and backend services.
Handles: request routing, authentication (Lambda Authorizers, Cognito), throttling, SSL termination.
Two types for REST: REST API (full features) and HTTP API (faster, cheaper, fewer features).
Integrates directly with Lambda for serverless API backends.
# Q255. REST API Gateway?
REST API Gateway is the original, feature-rich API type in API Gateway.
Supports: API keys, usage plans, request/response transformations, caching, AWS WAF integration.
More expensive and slightly higher latency than HTTP API.
Best for: complex enterprise APIs needing fine-grained control, API key management, advanced throttling.
# Q256. HTTP API Gateway?
HTTP API is the newer, lighter, and cheaper API type in API Gateway.
Lower latency and cost compared to REST API — up to 70% cheaper.
Supports: JWT authorizers, CORS, automatic deployments.
Does not support: API keys, usage plans, response transformations, or AWS WAF directly.
Best for: serverless backend APIs where you need speed and low cost without advanced features.
# Q257. Lambda Authorizer?
A Lambda Authorizer is a Lambda function that controls access to an API Gateway endpoint.
Receives the request token (JWT or API key) and returns an IAM policy (Allow or Deny).
Two types: Token-based (receives a bearer token) and Request-based (receives entire request context).
The policy is cached by API Gateway to avoid calling the authorizer on every request.
Use for: custom authentication logic, validating third-party JWT tokens.
# Q258. IAM?
IAM (Identity and Access Management) controls who can do what in AWS.
Manages users, groups, roles, and their permissions.
Everything in AWS is secured by IAM — every API call is authenticated and authorized.
Principle of least privilege: grant only the minimum permissions required.
Key components: Users (humans), Roles (for services/apps), Policies (JSON permission documents).
# Q259. IAM Roles?
An IAM Role is an identity with a set of permissions that can be assumed by AWS services, applications, or users.
Lambda functions assume a role to access other AWS services (S3, DynamoDB, SQS).
Roles don't have long-term credentials — they use temporary, auto-rotating credentials.
Attach policies to roles to grant specific permissions.
Key principle: always use roles for service-to-service access — never hardcode access keys.
# Q260. IAM Policies?
IAM Policies are JSON documents that define what actions are allowed or denied on which resources.
Attached to users, groups, or roles.
Structure: Effect (Allow/Deny), Action (s3:GetObject), Resource (ARN of the resource).
AWS-managed policies: pre-built by AWS for common use cases.
Customer-managed policies: custom policies tailored to your needs.
Key rule: deny by default — access must be explicitly allowed.
# Q261. SQS?
SQS (Simple Queue Service) is a fully managed message queue service.
Producers send messages to the queue; consumers poll and process them.
Decouples producers and consumers — they don't need to be available simultaneously.
Two types: Standard (best-effort ordering, at-least-once delivery) and FIFO (exactly-once, ordered).
Used for: task queues, decoupling microservices, load leveling, Lambda triggers.
# Q262. FIFO Queue?
FIFO (First-In-First-Out) queues guarantee message order and exactly-once processing.
Messages are delivered and processed in the exact order they are sent.
Throughput is limited to 300 messages/second (or 3,000 with batching).
Message group IDs allow parallel processing of different message groups while maintaining order within each group.
Use for: financial transactions, order processing — any scenario where order and exactly-once matter.
# Q263. Standard Queue?
Standard queues offer maximum throughput — nearly unlimited messages per second.
At-least-once delivery: a message may occasionally be delivered more than once.
Best-effort ordering: messages are generally delivered in order but not guaranteed.
Consumers must be idempotent to handle duplicate messages.
Use for: high-throughput scenarios where occasional duplicates are acceptable (email sending, logging).
# Q264. Dead Letter Queue (DLQ)?
A DLQ is a separate queue where messages are moved after failing to process a configured number of times.
Prevents poison pill messages from blocking the queue indefinitely.
Configure maxReceiveCount on the main queue — after N failed processing attempts, the message moves to DLQ.
Monitor DLQ for failed messages — it indicates processing issues that need investigation.
Lambda integrates with SQS and automatically handles DLQ routing.
# Q265. Visibility Timeout?
The visibility timeout is the period during which a message being processed by a consumer is hidden from other consumers.
Default: 30 seconds. Max: 12 hours.
If the consumer processes and deletes the message within the timeout, all is fine.
If the consumer fails or crashes, the timeout expires and the message becomes visible again for reprocessing.
Set visibility timeout to at least the maximum processing time of your consumer.
# Q266. CloudWatch?
CloudWatch is AWS's monitoring and observability service.
Collects metrics, logs, events, and traces from AWS services and your applications.
Create alarms that trigger based on metric thresholds (e.g., CPU > 80% → scale out).
Dashboards provide real-time visualization of metrics.
Key services: CloudWatch Metrics (numerical data), CloudWatch Logs (log aggregation), CloudWatch Alarms (alerting).
# Q267. CloudWatch Logs?
CloudWatch Logs collects, stores, and analyzes log files from AWS services and applications.
Lambda automatically sends logs to CloudWatch Logs.
Use Log Groups (per service/app) and Log Streams (per instance/invocation).
Create metric filters to extract metrics from log patterns (e.g., count error occurrences).
Use Logs Insights for SQL-like querying of your logs.
# Q268. CloudWatch Metrics?
CloudWatch Metrics are numerical data points representing the state of your AWS resources over time.
Every AWS service emits built-in metrics (Lambda: invocations, errors, duration; SQS: message count).
Custom metrics: publish your own business metrics using the PutMetricData API.
Metrics are aggregated per time period (1 minute to 1 day).
Use for dashboards, alarms, and auto-scaling triggers.
# Q269. Step Functions?
AWS Step Functions is a serverless orchestration service for coordinating multi-step workflows.
Define workflows as state machines using Amazon States Language (JSON/YAML).
Steps can be Lambda functions, ECS tasks, SQS messages, or other AWS services.
Handles retries, error handling, parallel execution, and wait states automatically.
Ideal for: order processing workflows, ETL pipelines, approval workflows, microservice orchestration.
# Q270. State Machine?
A state machine in Step Functions defines the flow of a workflow.
States: Task (calls a Lambda or service), Choice (conditional branching), Wait (delay), Parallel (concurrent paths), Map (iterate over array), Succeed, Fail.
Transitions between states are defined by input/output and conditions.
Execution history is stored for debugging and auditing.
Express Workflows for short, high-throughput. Standard Workflows for long-running, exactly-once.
# Q271. SNS?
SNS (Simple Notification Service) is a fully managed pub/sub messaging service.
Publishers send messages to a Topic. Subscribers receive messages from the Topic.
Supports fan-out: one message → multiple subscribers simultaneously.
Subscribers can be: Lambda, SQS, HTTP/HTTPS endpoints, email, SMS.
Common pattern: SNS topic fans out to multiple SQS queues for parallel processing by different services.
# Q272. EventBridge?
Amazon EventBridge is a serverless event bus for routing events between AWS services and applications.
More powerful than SNS for event routing — supports event filtering, transformation, and routing rules.
Receives events from AWS services, SaaS apps, or your own apps.
Rules filter events and route them to targets (Lambda, SQS, Step Functions, etc.).
Replaces CloudWatch Events — use EventBridge for new event-driven architectures.
# Q273. S3?
S3 (Simple Storage Service) is AWS's object storage service for storing any type of file.
Highly durable (99.999999999% — 11 nines), scalable, and accessible over HTTP.
Objects are stored in buckets. Each object has a key (path) and metadata.
Storage classes: Standard, Infrequent Access, Glacier (archival), Intelligent Tiering.
Use for: application assets, backup, static websites, data lake storage, Lambda deployment packages.
# Q274. S3 Lifecycle?
S3 Lifecycle policies automate moving objects between storage classes based on age.
Example: move to Standard-IA after 30 days, to Glacier after 90 days, delete after 365 days.
Reduces storage costs significantly for logs, backups, and infrequently accessed data.
Configured at the bucket level with rules targeting specific prefixes or object tags.
Essential for cost optimization in production systems.
# Q275. Presigned URL?
A presigned URL is a temporary URL generated by AWS that grants time-limited, direct access to an S3 object.
No AWS credentials needed by the end user — permission is embedded in the URL.
Generated server-side using the AWS SDK with an expiry time.
Use for: allowing users to securely download or upload files directly to S3 without exposing your AWS credentials.
Workflow: client requests presigned URL from your API → API generates and returns URL → client uploads/downloads directly to S3.
# Q276. VPC?
VPC (Virtual Private Cloud) is a logically isolated virtual network in AWS.
You control IP address ranges, subnets, routing tables, and network gateways.
Public subnets: accessible from the internet. Private subnets: not directly accessible.
Resources in private subnets (RDS, Lambda in VPC) are protected from direct internet access.
Key interview line: "VPC = your own private network inside AWS."
# Q277. Security Groups?
Security groups act as virtual firewalls controlling inbound and outbound traffic for AWS resources.
Stateful: if inbound traffic is allowed, the corresponding outbound response is automatically allowed.
Rules specify: protocol, port range, and source/destination (IP range or another security group).
Deny by default — only allow explicitly permitted traffic.
Attach to EC2 instances, RDS databases, Lambda in VPC, load balancers.
# Q278. NAT Gateway?
A NAT (Network Address Translation) Gateway allows resources in private subnets to access the internet.
Outbound traffic is routed through the NAT Gateway in the public subnet to the internet.
Inbound connections from the internet are blocked — private resources remain secure.
Used for: Lambda in VPC downloading packages, EC2 instances updating software.
NAT Gateways are managed, highly available, but have a cost — consider VPC endpoints as cheaper alternatives.
# Q279. Load Balancer?
AWS Elastic Load Balancer (ELB) distributes incoming traffic across multiple targets.
Application Load Balancer (ALB): layer 7, HTTP/HTTPS routing by path and host — ideal for microservices.
Network Load Balancer (NLB): layer 4, ultra-high performance, TCP/UDP.
Gateway Load Balancer (GWLB): for deploying network appliances.
ALB integrates with Lambda, EC2, ECS, and supports WebSockets.
# Q280. Auto Scaling?
Auto Scaling automatically adjusts the number of EC2 instances or other resources based on demand.
Scale out (add instances) when load increases; scale in (remove instances) when load decreases.
Policies: Target Tracking (maintain a metric at a target value), Step Scaling, Scheduled Scaling.
Ensures availability during traffic spikes and reduces cost during low-traffic periods.
For Lambda: auto-scaling is built-in — Lambda scales concurrency automatically.
# Q281. Serverless Architecture?
Serverless means no server management — the cloud provider manages infrastructure.
Key services: Lambda (compute), API Gateway (routing), DynamoDB (database), S3 (storage), SQS (queuing).
You pay only for actual usage — no idle server costs.
Benefits: automatic scaling, high availability, reduced operational overhead.
Trade-offs: cold starts, execution time limits (15 min for Lambda), vendor lock-in.
# Q282. Lambda Monitoring?
Lambda automatically sends metrics to CloudWatch: invocations, errors, duration, throttles, concurrent executions.
Log output (Console.WriteLine in .NET) goes to CloudWatch Logs automatically.
Set alarms on error rate and duration to detect issues.
Use AWS X-Ray for distributed tracing across Lambda and other services.
Key metrics to monitor: error rate (should be near zero), p99 duration (should be within SLA), throttle count (increase concurrency limit if too high).
# Q283. Cost Optimization?
Use Lambda for sporadic, event-driven workloads — pay per execution.
Use EC2 Spot Instances for fault-tolerant batch workloads — up to 90% cheaper.
S3 Lifecycle policies to tier old data to cheaper storage classes.
Reserved Instances or Savings Plans for predictable, long-running workloads.
Right-size Lambda memory — more memory = faster execution = possibly cheaper overall.
Eliminate idle resources: stop dev/test instances outside business hours.
# Q284. API Security (AWS)?
Use Lambda Authorizers or Cognito User Pools for API Gateway authentication.
Enable WAF (Web Application Firewall) to protect against SQL injection, XSS, and DDoS.
Use API Gateway usage plans and API keys to throttle and track consumers.
Enable SSL/TLS — API Gateway enforces HTTPS by default.
Store secrets in AWS Secrets Manager or Parameter Store — never in code or environment variables.
# Q285. AWS Secrets Manager?
Secrets Manager stores and rotates secrets (DB passwords, API keys) automatically.
Applications fetch secrets at runtime via the SDK — no secrets in code or config files.
Supports automatic rotation for RDS and other services — the password rotates without downtime.
Audit secret access via CloudTrail.
Preferred over Parameter Store for secrets that need automatic rotation.
# Q286. Parameter Store?
AWS Systems Manager Parameter Store stores configuration data and secrets.
Types: String (plain text), SecureString (encrypted via KMS), StringList.
Free tier available (Standard parameters) — cheaper than Secrets Manager for non-rotating secrets.
Use for: feature flags, configuration values, non-rotating secrets.
Lambda and EC2 can fetch parameters at startup for dynamic configuration.
# Q287. CloudFormation?
CloudFormation is AWS's Infrastructure as Code (IaC) service.
Define infrastructure in YAML or JSON templates.
Provisions all resources in a stack atomically — if any resource fails, the stack rolls back.
Enables: version-controlled infrastructure, repeatable deployments, environment parity.
Key interview line: "CloudFormation = describe your infrastructure as code; AWS creates it."
# Q288. Terraform Basics?
Terraform is an open-source IaC tool by HashiCorp — works across cloud providers.
Define infrastructure in HCL (HashiCorp Configuration Language).
Key commands: terraform init, plan (preview changes), apply (provision), destroy.
State file tracks the current state of provisioned infrastructure.
Preferred over CloudFormation when working across multiple cloud providers or for more flexible workflows.
# Q289. Multi-Region Deployment?
Deploy the application in multiple AWS regions for disaster recovery and global performance.
Use Route 53 for DNS with latency-based or geolocation routing.
Replicate data: RDS cross-region read replicas, DynamoDB Global Tables, S3 Cross-Region Replication.
Active-Active: all regions serve traffic simultaneously. Active-Passive: secondary region is a standby.
Design for the possibility that a full region becomes unavailable.
# Q290. High Availability?
High Availability (HA) means the system is operational as much as possible — minimizing downtime.
Achieved via: redundancy (multiple instances/AZs), auto-scaling, load balancing, failover mechanisms.
Deploy across multiple Availability Zones (AZs) in the same region for fault isolation.
RDS Multi-AZ: synchronous replication with automatic failover.
Target: 99.99% (four nines) = less than 1 hour downtime per year.
@xunit
# Q291. Unit Testing?
Unit testing tests a single unit of code (usually a method or class) in isolation.
External dependencies (DB, HTTP) are mocked or stubbed.
Tests run fast and require no external infrastructure.
Follow the AAA pattern: Arrange (set up), Act (execute), Assert (verify).
Key benefit: catch bugs early, enable safe refactoring, act as living documentation.
# Q292. Integration Testing?
Integration testing tests how multiple components work together.
Tests real interactions between services, databases, and external systems.
Slower than unit tests — may require a running database, network, etc.
In ASP.NET Core, use WebApplicationFactory<T> to spin up a test server and test the full HTTP pipeline.
Balance: unit tests for logic, integration tests for real interactions.
# Q293. Mocking?
Mocking replaces a real dependency with a fake implementation that you control.
Allows testing code in isolation without needing real databases, HTTP calls, or file systems.
A mock can verify: was a method called? How many times? With what arguments?
Key distinction: Mock = verify behavior. Stub = return predefined values. Fake = lightweight working implementation.
# Q294. Moq Framework?
Moq is the most popular .NET mocking library.
Create a mock: var mock = new Mock<IUserRepository>();
Set up behavior: mock.Setup(r => r.GetById(1)).ReturnsAsync(user);
Inject the mock: var service = new UserService(mock.Object);
Verify calls: mock.Verify(r => r.GetById(1), Times.Once());
# Q295. Fact vs Theory?
[Fact] is a test that runs once with no parameters — a single, specific test case.
[Theory] is a parameterized test that runs multiple times with different data.
[Theory] uses [InlineData], [MemberData], or [ClassData] to provide test data.
Example: [Theory] [InlineData(2, 3, 5)] [InlineData(0, 0, 0)] public void Add_ReturnsSum(int a, int b, int expected).
Use Theory to test multiple input scenarios without writing separate test methods.
# Q296. Test Coverage?
Test coverage measures what percentage of your code is exercised by your tests.
Tools: Coverlet (free, .NET), Visual Studio Enterprise code coverage, SonarQube.
100% coverage does not guarantee bug-free code — focus on testing critical paths.
Aim for high coverage of: business logic, edge cases, error paths.
Coverage is a guide — don't write tests just to hit a number.
# Q297. Arrange Act Assert?
AAA is the standard pattern for structuring unit tests.
Arrange: set up the test data, dependencies, and initial state.
Act: call the method or operation being tested.
Assert: verify that the result matches expectations.
Example: Arrange (create user with email), Act (call IsEmailValid()), Assert (returns true).
# Q298. Dependency Mocking?
When testing a class that depends on interfaces (IEmailService, IUserRepository), replace them with mocks.
Use constructor injection — the test passes mock objects instead of real implementations.
This is why Dependency Injection and coding to interfaces is essential for testability.
Example: test OrderService by injecting Mock<IPaymentService> and Mock<IOrderRepository>.
# Q299. Mock Repository?
Create a mock of the repository interface: var mockRepo = new Mock<IUserRepository>();
Set up what it should return: mockRepo.Setup(r => r.GetAll()).ReturnsAsync(testUsers);
Inject it into the service being tested: var service = new UserService(mockRepo.Object);
Verify it was called: mockRepo.Verify(r => r.GetAll(), Times.Once());
This keeps tests fast and independent of the real database.
# Q300. TDD (Test Driven Development)?
TDD is a development approach: write a failing test first, then write code to make it pass, then refactor.
Red: write a failing test. Green: write minimum code to pass. Refactor: clean up the code.
Forces you to think about the interface and expected behavior before implementation.
Results in better-designed, more testable code.
Key benefit: tests become the specification — they document expected behavior.
# Q301. What should NOT be unit tested?
Constructors that just assign values — no logic to test.
Framework code (ASP.NET Core routing, EF Core internals) — not your code.
Private methods directly — test them through their public callers.
Database schemas or migrations — test with integration tests.
Simple getters/setters with no logic.
# Q302. How to test async methods?
Make the test method async and return Task: public async Task MethodName_Condition_ExpectedResult()
Await the method under test: var result = await service.GetUserAsync(1);
Use mock.Setup with ReturnsAsync() for async dependencies.
Use Assert.ThrowsAsync<T> for testing async exceptions.
Example: await Assert.ThrowsAsync<NotFoundException>(() => service.GetUserAsync(-1));
# Q303. Mock ILogger?
ILogger can be mocked with Moq: var mockLogger = new Mock<ILogger<MyService>>();
For verifying log calls: use Mock.Of<ILogger<T>>() or a custom LoggerFactory.
Alternatively: use the NullLoggerFactory or NullLogger<T>.Instance to suppress logging in tests.
Only verify logger calls if logging behavior is specifically what you're testing.
# Q304. Mock DbContext?
Option 1: Use an in-memory database provider for EF Core tests: optionsBuilder.UseInMemoryDatabase("TestDb")
Option 2: Use SQLite in-memory database — closer to real SQL behavior.
Option 3: Mock IRepository (preferred for unit tests) — abstract DbContext behind a repository.
Mocking DbContext directly with Moq is difficult — prefer the repository pattern for testable data access.
# Q305. Mock HttpClient?
HttpClient cannot be mocked directly with Moq.
Use IHttpClientFactory with a custom DelegatingHandler that intercepts HTTP calls.
Or use the MockHttpMessageHandler approach (WireMock.Net or custom).
Wrap HttpClient in an IApiClient interface and mock the interface instead.
Best practice: abstract HTTP calls behind an interface for easy testing.
# Q306. API Testing?
Test API endpoints using WebApplicationFactory<T> from Microsoft.AspNetCore.Mvc.Testing.
Creates an in-memory test server running your full ASP.NET Core pipeline.
Use HttpClient to send real HTTP requests to the test server.
Seed test data in an in-memory database.
Tests verify: status code, response body, headers — end-to-end without a real network or external DB.
# Q307. Controller Testing?
Unit test controllers by instantiating them directly with mocked services.
Or use WebApplicationFactory for full integration testing of the HTTP pipeline.
Unit test: var controller = new UserController(mockService.Object); var result = await controller.GetUser(1);
Verify: result is OkObjectResult with correct data.
For controllers with complex middleware (auth, filters), use integration testing with WebApplicationFactory.
# Q308. Service Testing?
Service tests are pure unit tests — test business logic in isolation.
Mock all dependencies (repositories, external services).
Focus on: correct business rules, error handling, edge cases.
Example: test that OrderService.CreateOrder() throws an exception when stock is 0.
Services should be easily testable — if they're hard to test, they're probably violating SOLID principles.
# Q309. Repository Testing?
Repository tests verify that data access code works correctly against a real (or test) database.
Use EF Core InMemory or SQLite in-memory provider for fast, isolated tests.
Test: does GetById return the right entity? Does Add save correctly?
For complex SQL queries (stored procedures, raw SQL), use a real test database.
Repository tests are integration tests — they test real database interactions.
# Q310. CI/CD Integration?
Run all unit and integration tests automatically on every commit in the CI pipeline.
Fail the build if any test fails — prevent broken code from being merged.
Generate a test coverage report in the pipeline (Coverlet + Cobertura format).
Run tests in parallel where possible to speed up the pipeline.
Integration tests requiring external services can run in Docker containers within the CI pipeline.
@systemdesign
# Q311. Design URL Shortener
Components: REST API (create and resolve), Database (short→long URL mapping), Cache (Redis for hot URLs).
Create flow: accept long URL → generate unique short code (base62 of auto-increment ID or random hash) → store mapping → return short URL.
Resolve flow: receive short code → check cache → if miss, check DB → redirect (301 or 302).
301 = permanent redirect (browser caches it — reduces future server load). 302 = temporary (always hits server).
Scale considerations: read-heavy system, heavily cache resolutions, use CDN for global performance.
Handle: custom aliases, expiry times, analytics (click counting), collision detection.
# Q312. Design Notification Service
Components: REST API (accept notification requests), Message Queue (SQS/RabbitMQ for decoupling), Workers (per channel: Email, SMS, Push), Template Engine, Delivery Status Tracker, User Preference Store.
Flow: API receives notification request → validates and publishes to queue → channel-specific worker consumes → renders template → sends via provider (SendGrid, Twilio, FCM).
Reliability: retry with exponential backoff, dead-letter queue for permanently failed messages.
User preferences: opt-out management per channel and notification type.
Scale: add more worker instances per channel independently based on load.
# Q313. Design Meeting Management System
Entities: User, Meeting (title, start, end, recurrence), Room (capacity, location), Attendee (user + response status).
Core features: create meeting, invite attendees, check room/user availability, reminders.
Conflict detection: query WHERE room_id = X AND NOT (end <= new_start OR start >= new_end) to find overlapping meetings.
Notifications: send email/push when meeting is created, updated, or cancelled — via a notification service.
Recurring meetings: store recurrence rule (RRULE format); generate instances on query rather than storing all.
Scale: read-heavy — cache room availability, use calendar-specific indexes on time ranges.
# Q314. Design Audit Logging System
Every significant user action is published as an event to a message queue.
An audit worker consumes events and writes to an append-only audit log store.
Audit record structure: userId, action, entityType, entityId, before-state (JSON), after-state (JSON), timestamp, IP address.
Storage: write-once, never update or delete. Use append-only DB or event store.
Query API: search by userId, entity, time range, action type.
Scale: high-volume writes — use Kafka or SQS for ingestion, time-series optimized storage.
# Q315. Design Authentication Service
Registration: hash password with bcrypt (salt + hash), store user record.
Login: verify bcrypt hash → generate access token (JWT, short-lived 15 min) and refresh token (long-lived, stored in DB).
Token refresh: validate refresh token → rotate (invalidate old, issue new) → return new access token.
Logout: invalidate refresh token in DB.
Security: rate limit login attempts, lock account after N failures, MFA support.
Token storage: access token in memory (JS), refresh token in HTTP-only cookie.
# Q316. Design Chat Application
Persistent connections: WebSockets for real-time bidirectional messaging.
Message flow: client sends message → server broadcasts to all participants in the room.
Multi-server scale: use Redis Pub/Sub to fan out messages to clients connected on different servers.
Message persistence: store all messages in DB for history.
Presence: track online users with heartbeat mechanism (Redis key with expiry per user).
Media: store files in S3, send the URL in the message payload.
# Q317. Design Document Storage System
Upload: client → API → stream file to object storage (S3/Azure Blob) → store metadata in DB.
Metadata: filename, owner, tags, created date, size, storage key, permissions.
Versioning: each upload creates a new version record. Previous versions are retained. Mark latest version explicitly.
Search: index metadata in Elasticsearch or Azure Search for full-text search on filenames, tags, content.
Access control: role-based — owner, viewers, editors. Generate presigned URLs for file download.
Preview: background job generates thumbnails/previews for common formats.
# Q318. Design E-Commerce Backend
Services: User Service, Product Catalog Service, Inventory Service, Cart Service, Order Service, Payment Service, Notification Service.
Order flow: Cart → Create Order → Reserve Inventory → Process Payment → Confirm Order → Send Confirmation.
Saga pattern: if payment fails → release inventory → cancel order → notify user.
Inventory: use optimistic locking or DB-level reservation to prevent overselling.
Product catalog: cache aggressively in Redis — reads are 99% of traffic.
Search: Elasticsearch for product search with full-text, filtering, and faceting.
# Q319. Design File Upload Service
Upload flow: client requests presigned URL from API → API generates S3 presigned URL with expiry → client uploads directly to S3 → client notifies API of completion.
Direct-to-S3 upload reduces API server load — the file never passes through the API server.
Large files: multipart upload — split into chunks, upload in parallel, S3 assembles them.
Post-upload processing: S3 event → Lambda trigger → virus scan → generate thumbnail → update DB metadata.
Access: serve files via presigned URLs (time-limited) or CDN for public assets.
Never store files in the database — always in object storage.
# Q320. Design GRC Platform
GRC = Governance, Risk, and Compliance.
Core modules: Policy Management, Risk Register, Control Library, Audit Management, Issue Tracking.
Key features: role-based access (auditor, reviewer, admin), approval workflows, document versioning, audit trails.
Workflows: Step Functions or BullMQ for multi-step approval processes with notifications.
Audit logging: every change to every record is logged with who changed what and when.
Reporting: compliance dashboards, risk heat maps, status reports — pre-aggregate in a reporting DB.
Scale: document-heavy reads — use CDN for policy documents, cache dashboard metrics.
# Q321. Rate Limiting Design
Strategies: Fixed Window (count per time window), Sliding Window (rolling window), Token Bucket (burst allowance), Leaky Bucket (smoothed output rate).
Storage: Redis is ideal — INCR command with EXPIRE for per-key counters.
Key: rate limit by user ID, API key, or IP address.
Response: return 429 Too Many Requests with Retry-After header.
Distributed: Redis-based counters work correctly across multiple API server instances.
Tiers: different limits per subscription tier (free, pro, enterprise).
# Q322. Distributed Cache Design
Chose Redis for its performance, data structure support, and cluster capability.
Cache-aside pattern: app checks cache first → if miss, reads from DB, stores in cache → subsequent reads hit cache.
Eviction policies: LRU (Least Recently Used) for general caches, TTL-based expiry for time-sensitive data.
Cache invalidation: on write, explicitly delete or update the cached item. Or use TTL and accept stale data briefly.
Cache stampede prevention: use mutex lock on cache miss so only one request populates the cache.
Redis Cluster for horizontal scaling of the cache tier.
# Q323. Search Service Design
Build a search service on top of Elasticsearch or Azure Cognitive Search.
Index documents with structured fields: title, tags, content, metadata.
Sync strategy: DB as source of truth → publish change events → search indexer consumes events and updates index.
Near real-time: events ensure the search index is updated within seconds of a DB change.
Query features: full-text search, filtering, faceting (aggregate counts by category), sorting, pagination.
Scale: Elasticsearch scales horizontally — add nodes to the cluster for more capacity.
# Q324. Event Driven System Design
Message broker: Kafka for high throughput, RabbitMQ for routing flexibility, AWS EventBridge for AWS-native.
Producers publish domain events: OrderPlaced, PaymentProcessed, UserRegistered.
Consumers subscribe to events they care about and react independently.
Schema registry: define event schemas (Avro, JSON Schema) to enforce contracts between producers and consumers.
Idempotency: consumers must handle duplicate events gracefully (store processed event IDs).
Dead letter topic: unprocessable events go to a DLT for investigation.
# Q325. Queue Based System Design
Queues decouple producers from consumers and enable asynchronous processing.
Pattern: API writes task to queue → worker polls queue → processes task → deletes message on success.
Visibility timeout ensures messages are reprocessed if a worker crashes mid-processing.
Dead letter queue: messages that fail processing N times are moved to DLQ for investigation.
Scaling: add more consumer instances to increase throughput — queue naturally load-levels.
Use cases: email sending, order processing, image resizing, report generation.
# Q326. High Availability Design
Deploy across multiple Availability Zones — no single point of failure.
Load balancer distributes traffic across multiple instances.
Database: Multi-AZ RDS with automatic failover or Aurora with read replicas.
Stateless services: no session state stored locally — all state in DB/cache (Redis).
Health checks: load balancer routes only to healthy instances.
Circuit breakers: prevent cascading failures when a downstream service is unavailable.
Aim: 99.99% availability (four nines).
# Q327. Failover Design
Active-Passive: primary handles traffic; standby is a hot replica. On failure, DNS switches to standby.
Active-Active: multiple regions simultaneously serve traffic. Faster recovery, higher cost.
RDS Multi-AZ: synchronous replication, automatic failover in 60-120 seconds.
Route 53 health checks: automatically switch DNS to a healthy endpoint on failure.
Chaos engineering: deliberately test failure scenarios (Netflix Chaos Monkey approach).
Key metric: RTO (Recovery Time Objective) and RPO (Recovery Point Objective) define acceptable downtime and data loss.
# Q328. Multi-Tenant Architecture
Approaches: Database per tenant (best isolation, highest cost), Schema per tenant (moderate isolation), Shared DB with tenant ID (most efficient, least isolation).
Tenant isolation: every query must include a tenant ID filter — never leak data between tenants.
Middleware: resolve tenant from subdomain/header/JWT and add to request context.
Separate configurations per tenant: feature flags, branding, integrations.
Scale: shared infrastructure scales efficiently; per-tenant isolation is used for high-value or compliance-sensitive customers.
# Q329. Monitoring Architecture
Metrics: CloudWatch (AWS), Application Insights (Azure), Prometheus + Grafana (self-hosted).
Logs: CloudWatch Logs, ELK Stack (Elasticsearch + Logstash + Kibana), Splunk.
Traces: AWS X-Ray, Jaeger, OpenTelemetry.
Alerting: PagerDuty, OpsGenie, CloudWatch Alarms.
Key metrics to monitor: error rate, latency (p50, p95, p99), throughput (requests per second), resource utilization (CPU, memory), queue depth.
SLO dashboard: always have a top-level view of system health visible to the team.
# Q330. Logging Architecture
Structured logging: log JSON with consistent fields (timestamp, level, service, traceId, userId, message).
Centralized collection: all services ship logs to a central aggregator (Fluentd, Logstash, CloudWatch Agent).
Storage: Elasticsearch for searchable logs, S3 for long-term archive.
Correlation: every log entry includes the correlation ID to trace a request across services.
Log levels: DEBUG (dev only), INFO (normal operations), WARN (unexpected but handled), ERROR (failed operations), CRITICAL (system-impacting).
Retention: production logs retained for 90 days actively, archived to S3 for compliance.

# Q_SQL_1. Find employees with salary > 50000
SELECT * FROM Employee WHERE Salary > 50000;
# Q_SQL_2. Find employees whose name starts with 'A'
SELECT * FROM Employee WHERE Name LIKE 'A%';
# Q_SQL_3. Find duplicate records
SELECT Email, COUNT(*) AS DuplicateCount
FROM Employee
GROUP BY Email
HAVING COUNT(*) > 1;
# Q_SQL_4. Count employees department-wise
SELECT Department, COUNT(*) AS TotalEmployees
FROM Employee
GROUP BY Department;
# Q_SQL_5. Second Highest Salary
SELECT MAX(Salary) FROM Employee
WHERE Salary < (SELECT MAX(Salary) FROM Employee);
# Q_SQL_6. Third Highest Salary (using DENSE_RANK)
SELECT Salary FROM (
  SELECT Salary, DENSE_RANK() OVER (ORDER BY Salary DESC) AS RankNo
  FROM Employee
) X WHERE RankNo = 3;
# Q_SQL_7. Top 5 Highest Salaries
SELECT TOP 5 * FROM Employee ORDER BY Salary DESC;
# Q_SQL_8. Employees earning above their department average
SELECT * FROM Employee E
WHERE Salary > (
  SELECT AVG(Salary) FROM Employee
  WHERE Department = E.Department
);
# Q_SQL_9. Find employees with no manager
SELECT * FROM Employee WHERE ManagerId IS NULL;
# Q_SQL_10. Delete Duplicate Records (keep lowest Id)
WITH CTE AS (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY Email ORDER BY Id) AS RN
  FROM Employee
)
DELETE FROM CTE WHERE RN > 1;
# Q_SQL_11. Running Total of Salary
SELECT Name, Salary,
  SUM(Salary) OVER (ORDER BY Id) AS RunningTotal
FROM Employee;
# Q_SQL_12. Nth Highest Salary (generic, replace N)
SELECT Salary FROM (
  SELECT DISTINCT Salary, DENSE_RANK() OVER (ORDER BY Salary DESC) AS r
  FROM Employee
) x WHERE r = 2; -- replace 2 with N
# Q_SQL_13. Find all employees in a specific department with salary rank
SELECT Name, Department, Salary,
  DENSE_RANK() OVER (PARTITION BY Department ORDER BY Salary DESC) AS SalaryRank
FROM Employee;
# Q_SQL_14. Department-wise highest salary
SELECT Department, MAX(Salary) AS HighestSalary
FROM Employee
GROUP BY Department;
# Q_SQL_15. Find employees who joined in the last 30 days
SELECT * FROM Employee WHERE HireDate >= DATEADD(DAY, -30, GETDATE());
# Q_SQL_16. Count employees per department with running total
SELECT Department, COUNT(*) AS EmpCount,
  SUM(COUNT(*)) OVER (ORDER BY Department) AS RunningTotal
FROM Employee
GROUP BY Department;
# Q_SQL_17. Find employees with same salary
SELECT Salary, COUNT(*) AS Count FROM Employee
GROUP BY Salary HAVING COUNT(*) > 1;
# Q_SQL_18. Employee and Manager names using self-join
SELECT E.Name AS EmployeeName, M.Name AS ManagerName
FROM Employee E
LEFT JOIN Employee M ON E.ManagerId = M.Id;
# Q_SQL_19. Find missing IDs in a sequence
SELECT Id + 1 AS MissingId FROM Employee E1
WHERE NOT EXISTS (SELECT 1 FROM Employee E2 WHERE E2.Id = E1.Id + 1)
AND Id < (SELECT MAX(Id) FROM Employee);
# Q_SQL_20. Pivot: Department-wise salary by year
SELECT Department,
  [2022] AS Salary_2022, [2023] AS Salary_2023, [2024] AS Salary_2024
FROM (
  SELECT Department, YEAR(HireDate) AS Yr, Salary FROM Employee
) Src
PIVOT (SUM(Salary) FOR Yr IN ([2022],[2023],[2024])) AS PivotTable;
# Q_SQL_21. Recursive CTE: Org hierarchy
WITH OrgCTE AS (
  SELECT Id, Name, ManagerId, 0 AS Level FROM Employee WHERE ManagerId IS NULL
  UNION ALL
  SELECT E.Id, E.Name, E.ManagerId, O.Level + 1
  FROM Employee E JOIN OrgCTE O ON E.ManagerId = O.Id
)
SELECT * FROM OrgCTE ORDER BY Level;
# Q_SQL_22. LEAD and LAG: Compare salary with next and previous employee
SELECT Name, Salary,
  LAG(Salary, 1, 0) OVER (ORDER BY Id) AS PrevSalary,
  LEAD(Salary, 1, 0) OVER (ORDER BY Id) AS NextSalary
FROM Employee;
# Q_SQL_23. MERGE: Upsert employee data
MERGE Employee AS Target
USING NewEmployees AS Source ON Target.Id = Source.Id
WHEN MATCHED THEN UPDATE SET Target.Salary = Source.Salary
WHEN NOT MATCHED THEN INSERT (Id, Name, Salary) VALUES (Source.Id, Source.Name, Source.Salary)
WHEN NOT MATCHED BY SOURCE THEN DELETE;
# Q_SQL_24. Find first non-repeating character using SQL

bool IsBalanced(string s) {
    var stack = new Stack<char>();
    foreach (char c in s) {
        if (c == '(') stack.Push(c);
        else if (c == ')') {
            if (!stack.Any()) return false;
            stack.Pop();
        }
    }
    return !stack.Any();
}

# Q_R_JWT. JWT Authentication Flow
1. User submits credentials (email + password) to POST /auth/login.
2. Server validates credentials against the database.
3. Server generates access token (JWT, signed with secret, 15-min expiry) and refresh token (opaque, stored in DB, 7-day expiry).
4. Returns access token in response body and refresh token in HTTP-only cookie.
5. Client stores access token in memory (not localStorage — XSS risk) and sends in Authorization: Bearer header on each request.
6. Server validates JWT on each request: verify signature, check expiry, extract claims.
7. On access token expiry, client sends refresh token to POST /auth/refresh.
8. Server validates refresh token, rotates it (invalidate old, issue new), returns new access token.
9. On logout: invalidate refresh token in DB.
# Q_R_OAuth. OAuth 2.0 Flow (Authorization Code Flow)
1. User clicks "Sign in with Google" on your app.
2. Your app redirects to Google's authorization server with: client_id, redirect_uri, scope, state (CSRF protection), response_type=code.
3. User logs in to Google and grants permission.
4. Google redirects back to your app with an authorization code.
5. Your app backend exchanges the authorization code for tokens: sends code + client_secret to Google's token endpoint.
6. Google returns: access token (short-lived), refresh token (long-lived), ID token (user identity, OpenID Connect).
7. Your app uses the access token to call Google APIs on behalf of the user.
8. Use the refresh token to get new access tokens without the user needing to log in again.
# Q_R_Repo. Repository Pattern
Interface: public interface IUserRepository { Task<User> GetById(int id); Task Add(User user); Task<IEnumerable<User>> GetAll(); }
Implementation: public class UserRepository : IUserRepository { private readonly AppDbContext _context; ... }
Registration: builder.Services.AddScoped<IUserRepository, UserRepository>();
Usage: Service receives IUserRepository via constructor injection.
Benefits: decouples service layer from EF Core, enables easy unit testing with mock repositories, single place for data access logic.
# Q_R_DI. Dependency Injection in your project
Register: builder.Services.AddScoped<IOrderService, OrderService>();
Inject: public OrderController(IOrderService orderService) { _orderService = orderService; }
The DI container resolves the dependency at runtime.
Lifetimes used: Scoped for services and DbContext (per request), Singleton for caching and logging, Transient for validators.
Testing benefit: inject Mock<IOrderService>() in unit tests instead of real implementation.
# Q_R_LINQ. LINQ Optimization in practice
Use IQueryable instead of IEnumerable when filtering DB data — keeps filtering server-side.
Use Select to project only needed columns — don't fetch entire entities when you need two fields.
Use AsNoTracking() for read-only queries — saves EF change tracking overhead.
Use Include for known related data needs — avoid N+1 with lazy loading.
Avoid: calling .ToList() before filtering — always filter first, then materialize.
# Q_R_SQL. SQL Query Optimization in practice
Analyze execution plan — look for table scans, key lookups, sort operators.
Add indexes on frequently filtered and joined columns.
Use covering indexes — include all columns needed by the query in the index.
Avoid: functions on indexed columns in WHERE clause, implicit type conversions, SELECT *.
Rewrite correlated subqueries as JOINs where possible.
Use pagination (OFFSET/FETCH) for large result sets.
# Q_R_Redux. Redux Flow in your React app
UI event (button click) → dispatch an action creator.
Action creator (thunk) makes an API call asynchronously.
On success: dispatches the success action with payload.
Reducer updates the slice state with the new data.
useSelector picks up the updated state; component re-renders with new data.
Example: user clicks "Fetch Orders" → dispatch(fetchOrders()) → thunk calls API → dispatches ordersLoaded → reducer updates orders array → component renders order list.
# Q_R_Middleware. Middleware Pipeline in your project
Request enters: UseCors() → UseHttpsRedirection() → UseAuthentication() → UseAuthorization() → UseRouting() → Controller action.
Custom middleware (request logging, correlation ID generation) added before authentication.
Error handling middleware wraps the entire pipeline to catch unhandled exceptions.
Response flows back through middleware in reverse order.
# Q_R_ExHandling. Exception Handling Middleware
Global exception middleware catches all unhandled exceptions in the pipeline.
Logs the full exception (stack trace, request details) to Serilog/CloudWatch.
Returns a Problem Details response (RFC 7807): title, status code, detail, instance.
Never exposes internal details to the client.
Custom exceptions (NotFoundException, ValidationException) are mapped to specific status codes (404, 400).
# Q_R_MSComm. Microservice Communication in your project
Synchronous: REST API calls between services using HttpClientFactory with Polly retry and circuit breaker policies.
Asynchronous: SQS for fire-and-forget messaging between services.
Service discovery: services use environment variables or AWS Cloud Map for endpoint discovery.
Correlation IDs: passed in headers across all service calls for end-to-end tracing.
Resilience: retry (transient failures), circuit breaker (failing service), timeout (unresponsive service).
# Q_R_Lambda. AWS Lambda + API Gateway in your project
Client → HTTPS request → API Gateway → JWT validation (Lambda Authorizer or Cognito) → routes to Lambda function.
Lambda function processes request: validates input, calls DynamoDB or RDS, returns response.
Lambda is packaged as a Docker image or deployment package and deployed via CI/CD pipeline.
Configuration via environment variables and AWS Parameter Store.
Monitoring: CloudWatch for logs and metrics, X-Ray for tracing.
# Q_R_SQS. SQS Queue Processing in your project
Producer (Lambda or API) sends a message to an SQS queue with the task payload.
Consumer Lambda (triggered by SQS event source mapping) receives batches of messages.
Processes each message: validates, calls downstream services, updates database.
On success: Lambda automatically deletes the processed messages from the queue.
On failure: failed messages retry up to maxReceiveCount times, then move to Dead Letter Queue.
Visibility timeout is set to twice the maximum Lambda execution time.
# Q_R_StepFunctions. Step Functions Workflow in your project
Orchestrates multi-step processes: Order → Payment → Inventory → Notification.
Each step is a Lambda function or AWS SDK integration.
If a step fails: Step Functions can retry automatically with backoff, or execute a catch/compensate path.
Execution history provides full visibility into each workflow run.
Used instead of chained Lambda calls — centralizes workflow logic, handles errors gracefully.
# Q_R_Testing. xUnit Testing Strategy in your project
Unit tests: every service method has unit tests. Mock all external dependencies (repositories, HTTP clients) with Moq.
Integration tests: WebApplicationFactory spins up a test server with an in-memory database.
Test naming: MethodName_Condition_ExpectedResult (e.g., GetUser_WhenIdIsInvalid_ThrowsNotFoundException).
CI/CD: tests run automatically on every pull request. PR cannot be merged if tests fail.
Coverage: Coverlet generates coverage report; SonarQube enforces minimum 80% coverage on business logic.
# Q_R_CICD. CI/CD Pipeline in your project
Source: Git push to feature branch triggers the pipeline.
Build: restore packages, compile, run unit tests.
Test: run integration tests in a Docker container with a test database.
Quality: SonarQube scan for code quality and coverage.
Package: Docker image built and pushed to ECR (AWS) or Azure Container Registry.
Deploy: automatically deploy to staging on main branch merge; manual approval for production.
Tools: GitHub Actions or Azure DevOps YAML pipelines.
# Q_R_Debug. Production Issue Debugging approach
Identify: alert from CloudWatch or user report — check dashboards for error rate or latency spike.
Correlate: find the failing request's correlation ID in the logs.
Trace: follow the correlation ID across all service logs to find where it failed.
Analyze: check the exception, stack trace, and request payload.
Reproduce: replicate in a staging environment if possible.
Fix: root cause fix — not a band-aid. Write a regression test.
Deploy: push fix through CI/CD pipeline.
Post-mortem: document root cause, impact, and prevention measures.
# Q_R_MongoDB. MongoDB vs SQL Server
SQL Server: structured data with relationships, ACID transactions, complex queries with joins, reporting.
MongoDB: flexible schema (document structure varies), high write throughput, nested/hierarchical data, horizontal scaling.
In your project: SQL Server for core transactional data (users, orders, meetings). MongoDB for activity logs, audit events, flexible document storage.
Key insight: don't choose MongoDB just because it's popular — use it when the document model genuinely fits the data.

        // Custom Parser to process the massive text efficiently
        function parseRawData() {
            const raw = document.getElementById('rawQAData').textContent.trim();
            const lines = raw.split('\n');
            let currentCat = '';
            let currentQ = '';
            let currentA = '';
            
            const saveCurrentQ = () => {

                        cat: currentCat,
                        q: currentQ,

                    });

                    <div class="p-4 flex justify-between items-start cursor-pointer select-none gap-3" onclick="toggleQ('${q.id}')">

            const term = document.getElementById('searchInput').value.toLowerCase();
            if (term.length < 2) {
                renderCategory(currentCat);
                return;
            }

            const results = db.questions.filter(q => 
                q.q.toLowerCase().includes(term) || q.a.toLowerCase().includes(term)

            document.getElementById('currentCategoryTitle').innerText = 'Search Results';
            document.getElementById('currentCategoryDesc').innerText = `Found ${results.length} questions matching "${term}"`;

                q: q.q.replace(regex, '<span class="search-highlight">$1</span>'),

            renderCategory(null, highlightedResults);

        function updateProgressChart() {
            const total = db.questions.length;
            const mastered = Object.values(userProgress).filter(v => v).length;
            const pct = Math.round((mastered / total) * 100) || 0;
            
            document.getElementById('chartPercentage').innerText = `${pct}%`;

            const ctx = document.getElementById('progressChart').getContext('2d');
            if (progressChartInstance) {
                progressChartInstance.data.datasets[0].data = [mastered, total - mastered];
                progressChartInstance.update();
                return;

            progressChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Mastered', 'Remaining'],
                    datasets: [{
                        data: [mastered, total - mastered],
                        backgroundColor: ['#10b981', '#e2e8f0'],
                        borderWidth: 0,
                        hoverOffset: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                }
